name: Monitor (health)

# Topology-driven health check — no hardcoded server names or IPs.
# Everything is discovered from repo variables at run time:
#
#   BACKEND_HOSTS   csv of backend tailnet names       e.g. cybercontrol-app,cybercontrol-app-2
#   WA_HOSTS        csv of WA service tailnet names    e.g. cybercontrol-wa,cybercontrol-wa-2
#   EXT_HOSTS       csv of extension-service names     e.g. cybercontrol-ext
#   WA_INSTANCES    csv of WA instance names (for DB heartbeat check, may differ from WA_HOSTS)
#   LB_IPS          csv of LB public IPs for public-path check  e.g. 1.2.3.4:AWS-LB-1,5.6.7.8:AWS-LB-2
#   PUBLIC_DOMAIN   the public domain                   e.g. cybercontrol.fun
#
# Add/remove VMs by updating the repo variables only — no code change needed.
# Runs every 15 min; also runnable on demand.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    continue-on-error: true   # health degradation alerts but never blocks CI
    steps:
      - name: Join tailnet (OAuth)
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cybercontrol
          args: --accept-dns=true

      - name: Ensure MagicDNS resolves
        run: |
          sudo tailscale set --accept-dns=true 2>/dev/null || true
          # Wait up to 15s for peers to appear
          for i in $(seq 1 15); do
            tailscale status 2>/dev/null | grep -q "^100\." && echo "Tailscale peers visible" && break
            sleep 1
          done
          # Inject all tailnet peers into /etc/hosts as fallback for MagicDNS
          tailscale status | awk 'NR>1 && $1~/^100\./ {
            ip=$1; name=$2; sub(/\..*/, "", name)
            if(name) print ip "  " name
          }' | sudo tee -a /etc/hosts
          echo "Tailscale status:"
          tailscale status | head -15

      - name: Check services
        env:
          DATABASE_URL:   ${{ secrets.DATABASE_URL }}
          BACKEND_HOSTS:  ${{ vars.BACKEND_HOSTS }}
          WA_HOSTS:       ${{ vars.WA_HOSTS }}
          EXT_HOSTS:      ${{ vars.EXT_HOSTS }}
          WA_INSTANCES:   ${{ vars.WA_INSTANCES }}
          LB_IPS:         ${{ vars.LB_IPS }}
          PUBLIC_DOMAIN:  ${{ vars.PUBLIC_DOMAIN }}
        run: |
          fail=0
          out=""

          chk() {
            local url="$1" label="$2"
            if curl -fsS -m 8 "$url" >/dev/null 2>&1; then
              out="$out\n✅ $label"
            else
              out="$out\n❌ $label  ($url)"
              fail=1
            fi
          }

          chklb() {
            local ip="$1" label="$2" domain="${PUBLIC_DOMAIN:-cybercontrol.fun}"
            if curl -fsS -m 8 --resolve "${domain}:443:${ip}" "https://${domain}/api/health" >/dev/null 2>&1; then
              out="$out\n✅ LB $label (public)"
            else
              out="$out\n❌ LB $label (public)  ($ip)"
              fail=1
            fi
          }

          # ── Public LB IPs (optional) ───────────────────────────────
          if [ -n "${LB_IPS:-}" ]; then
            IFS=',' read -r -a lb_arr <<< "$LB_IPS"
            for spec in "${lb_arr[@]}"; do
              [ -z "$spec" ] && continue
              lb_ip="${spec%%:*}"; lb_label="${spec##*:}"
              chklb "$lb_ip" "$lb_label"
            done
          else
            out="$out\n⚠️  LB_IPS not set — skipping public LB check"
          fi

          # ── Backend hosts (:3000/api/health) ─────────────────────
          if [ -n "${BACKEND_HOSTS:-}" ]; then
            IFS=',' read -r -a hosts <<< "$BACKEND_HOSTS"
            for h in "${hosts[@]}"; do
              h="${h// /}"
              [ -z "$h" ] && continue
              chk "http://$h:3000/api/health" "backend  $h"
            done
          else
            out="$out\n⚠️  BACKEND_HOSTS not set — skipping backend check"
          fi

          # ── Extension-service hosts (:3300/health) ────────────────
          if [ -n "${EXT_HOSTS:-}" ]; then
            IFS=',' read -r -a hosts <<< "$EXT_HOSTS"
            for h in "${hosts[@]}"; do
              h="${h// /}"
              [ -z "$h" ] && continue
              chk "http://$h:3300/health" "extension-service  $h"
            done
          else
            out="$out\n⚠️  EXT_HOSTS not set — skipping extension-service check"
          fi

          # ── WA hosts: resolver (:3200) + service (:3100) ─────────
          if [ -n "${WA_HOSTS:-}" ]; then
            IFS=',' read -r -a hosts <<< "$WA_HOSTS"
            for h in "${hosts[@]}"; do
              h="${h// /}"
              [ -z "$h" ] && continue
              chk "http://$h:3200/health" "wa-resolver  $h"
              chk "http://$h:3100/health" "wa-service   $h"
            done
          else
            out="$out\n⚠️  WA_HOSTS not set — skipping WA check"
          fi

          # ── DB heartbeat: stale WA instances ─────────────────────
          if [ -n "${DATABASE_URL:-}" ] && [ -n "${WA_INSTANCES:-}" ]; then
            STALE=$(docker run --rm --network host postgres:15 \
              psql "$DATABASE_URL" -tAc \
              "SELECT coalesce(string_agg(instance, ', '), '')
               FROM wa_instances
               WHERE instance = ANY(string_to_array('${WA_INSTANCES}', ','))
               AND last_seen < now() - interval '90 seconds'" 2>/dev/null || echo "")
            if [ -n "$STALE" ]; then
              out="$out\n❌ STALE shards (no heartbeat >90s): $STALE"
              fail=1
            else
              out="$out\n✅ all WA shards fresh (heartbeat <90s)"
            fi
          else
            out="$out\n⚠️  DATABASE_URL or WA_INSTANCES not set — skipping heartbeat check"
          fi

          echo -e "## CyberControl health\n$out" >> "$GITHUB_STEP_SUMMARY"
          echo -e "$out"
          exit $fail
