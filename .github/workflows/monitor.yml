name: Monitor (health)

# Tailscale-driven health check.
# Active servers = nodes tagged tag:cybercontrol in the tailnet.
# Add a VM → it gets checked. Remove it from Tailscale → it disappears.
# No repo variables, no hardcoded names, no code changes ever needed.
#
# Role is inferred from hostname:
#   *-app* | *-backend*  → backend       :3000/api/health
#   *-ext*               → ext-service   :3300/health
#   *-wa*  | *-whatsapp* → wa-service    :3100/health  +  resolver :3200/health
#   *-db*                → skipped       (DB — no HTTP health endpoint)
#   *-redis*             → skipped       (Redis — no HTTP health endpoint)
#   *-lb*                → skipped       (LB — checked via PUBLIC_DOMAIN below)
#
# Optional:
#   LB_IPS        repo var  "ip1:label1,ip2:label2"  — public path check
#   PUBLIC_DOMAIN repo var  default: cybercontrol.fun
#   DATABASE_URL  secret    — WA shard heartbeat staleness check
#   WA_INSTANCES  repo var  — for the DB heartbeat query
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Join tailnet (OAuth)
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:cybercontrol
          args: --accept-dns=true

      - name: Discover peers + health check
        env:
          DATABASE_URL:  ${{ secrets.DATABASE_URL }}
          WA_INSTANCES:  ${{ vars.WA_INSTANCES }}
          LB_IPS:        ${{ vars.LB_IPS }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN }}
        run: |
          set -euo pipefail
          sudo tailscale set --accept-dns=true 2>/dev/null || true

          # Wait for peers to appear (up to 15s)
          for i in $(seq 1 15); do
            tailscale status 2>/dev/null | grep -q "^100\." && break
            sleep 1
          done

          # Inject all tailnet peers into /etc/hosts for reliable name resolution
          tailscale status | awk 'NR>1 && $1~/^100\./ {
            ip=$1; name=$2; sub(/\..*/, "", name)
            if (name) print ip "  " name
          }' | sudo tee -a /etc/hosts >/dev/null

          echo "=== Active tailnet nodes (tag:cybercontrol) ==="
          tailscale status | grep "tagged-devices" || echo "(none found)"

          fail=0
          out=""

          chk() {
            local url="$1" label="$2"
            if curl -fsS -m 8 "$url" >/dev/null 2>&1; then
              out="$out\n✅ $label"
            else
              out="$out\n❌ $label  ($url)"
              fail=1
            fi
          }

          # Discover all cybercontrol-tagged peers from tailscale status
          # Format: "100.x.x.x  hostname  tagged-devices  linux  -"
          while IFS= read -r line; do
            name=$(echo "$line" | awk '{print $2}')
            # strip domain suffix if present
            name="${name%%.*}"
            [ -z "$name" ] && continue

            case "$name" in
              *app*|*backend*)
                chk "http://$name:3000/api/health" "backend       $name" ;;
              *ext*)
                chk "http://$name:3300/health"     "ext-service   $name" ;;
              *wa*|*whatsapp*)
                chk "http://$name:3100/health"     "wa-service    $name"
                chk "http://$name:3200/health"     "wa-resolver   $name" ;;
              *db*|*redis*|*lb*)
                # infrastructure — no HTTP health endpoint, skip
                out="$out\n⊘  infra (skipped)  $name" ;;
              *)
                # unknown role — try backend port as default
                chk "http://$name:3000/health"     "unknown-role  $name" ;;
            esac
          done < <(tailscale status | awk '$3=="tagged-devices" {print}')

          if echo "$out" | grep -q "✅\|❌\|⊘"; then
            : # at least one node was checked
          else
            out="$out\n⚠️  No tag:cybercontrol nodes found in tailnet"
          fi

          # Optional: public LB check via LB_IPS repo var
          if [ -n "${LB_IPS:-}" ]; then
            domain="${PUBLIC_DOMAIN:-cybercontrol.fun}"
            IFS=',' read -r -a lb_arr <<< "$LB_IPS"
            for spec in "${lb_arr[@]}"; do
              [ -z "$spec" ] && continue
              lb_ip="${spec%%:*}"; lb_label="${spec##*:}"
              if curl -fsS -m 8 --resolve "${domain}:443:${lb_ip}" \
                   "https://${domain}/api/health" >/dev/null 2>&1; then
                out="$out\n✅ LB $lb_label (public)"
              else
                out="$out\n❌ LB $lb_label (public)  ($lb_ip)"
                fail=1
              fi
            done
          fi

          # Optional: DB heartbeat — WA shards stale >90s
          if [ -n "${DATABASE_URL:-}" ] && [ -n "${WA_INSTANCES:-}" ]; then
            STALE=$(docker run --rm --network host postgres:15 \
              psql "$DATABASE_URL" -tAc \
              "SELECT coalesce(string_agg(instance,', '),'')
               FROM wa_instances
               WHERE instance = ANY(string_to_array('${WA_INSTANCES}',','))
               AND last_seen < now() - interval '90 seconds'" 2>/dev/null || echo "")
            if [ -n "$STALE" ]; then
              out="$out\n❌ STALE shards (no heartbeat >90s): $STALE"
              fail=1
            else
              out="$out\n✅ all WA shards fresh"
            fi
          fi

          echo -e "## CyberControl health\n$out" >> "$GITHUB_STEP_SUMMARY"
          echo -e "$out"
          exit $fail
