name: Package extension

# Whenever anything under apps/extension/ (or product-path archives / @cc packages)
# changes on master, rebuild + pack a clean zip into the landing site's public/
# folder and commit it back. The landing Vercel project is git-connected, so it
# redeploys and the "Download extension" button always serves the latest build.
#
# The commit is made with GITHUB_TOKEN, which does NOT re-trigger workflows
# (so no loop); Vercel's GitHub app still receives the push and redeploys.

on:
  push:
    branches: [master]
    paths:
      - 'apps/extension/**'
      - 'packages/cc-*/**'
      - 'extension-legacy-best/**'
      - '.github/workflows/package-extension.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-extension
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # version comes from package.json "packageManager" (do not also set version: here)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # extension build uses node --experimental-strip-types (Node 22+)
          node-version: 22
          cache: pnpm

      - name: Install + rebuild + pack extension
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter cybercontrol-extension run pack

      - name: Copy zip to landing public/
        run: |
          mkdir -p apps/landing/public
          VERSION=$(node -p "require('./apps/extension/manifest.json').version")
          SRC="release/cybercontrol-extension-${VERSION}.zip"
          test -f "$SRC"
          cp -f "$SRC" apps/landing/public/cybercontrol-extension.zip
          ls -la apps/landing/public/cybercontrol-extension.zip

      - name: Commit the repackaged zip (if it changed)
        run: |
          git config user.name "cybercontrol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/landing/public/cybercontrol-extension.zip
          if git diff --cached --quiet; then
            echo "Extension package unchanged — nothing to commit."
          else
            git commit -m "chore(extension): repackage download zip [skip ci]"
            # Master may move while we pack (other CI bots). Rebase then push.
            git pull --rebase origin master
            git push
          fi
