name: Package extension

# Whenever anything under apps/extension/ changes on master, repackage it into the
# landing site's public/ folder and commit it back. The landing Vercel project
# is git-connected, so it redeploys automatically and the "Download extension"
# button on cybercontrol.fun always serves the latest build.
#
# The commit is made with GITHUB_TOKEN, which does NOT re-trigger workflows
# (so no loop); Vercel's GitHub app still receives the push and redeploys.

on:
  push:
    branches: [master]
    paths:
      - 'apps/extension/**'
      - 'packages/cc-*/**'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: package-extension
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install + rebuild extension bundles
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter cybercontrol-extension build

      - name: Package extension → apps/landing/public/cybercontrol-extension.zip
        run: |
          mkdir -p apps/landing/public
          rm -f apps/landing/public/cybercontrol-extension.zip
          cd apps/extension
          # -r recurse, -X drop extra OS attributes; exclude the internal design doc
          zip -r -X ../landing/public/cybercontrol-extension.zip . -x 'EXTENSION_DESIGN.md'

      - name: Commit the repackaged zip (if it changed)
        run: |
          git config user.name "cybercontrol-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f apps/landing/public/cybercontrol-extension.zip
          if git diff --cached --quiet; then
            echo "Extension package unchanged — nothing to commit."
          else
            git commit -m "chore(extension): repackage download zip [skip ci]"
            git push
          fi
