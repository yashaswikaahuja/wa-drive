name: AWS MVP sync secrets

# Push the same GitHub secrets/vars used by GCP deploy onto the AWS MVP host
# (.env), then recreate backend + extension-service so login/signup/AI work.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "SSH host"
        type: string
        default: "ubuntu@44.219.62.198"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH key
        env:
          KEY: ${{ secrets.AWS_MVP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aws.pem
          chmod 600 ~/.ssh/aws.pem

      - name: Sync secrets into /opt/cybercontrol-docker/.env and recreate app services
        env:
          HOST: ${{ inputs.host }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          WA_SECRET: ${{ secrets.WA_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEOCODE_API_KEY: ${{ secrets.GEOCODE_API_KEY }}
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_REDIRECT_URI: ${{ vars.GOOGLE_REDIRECT_URI }}
          SIGNUP_CODE: ${{ vars.SIGNUP_CODE }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          SES_FROM: ${{ vars.SES_FROM }}
          OWNER_PORT: ${{ vars.OWNER_PORT }}
          OWNER_BIND: ${{ vars.OWNER_BIND }}
          OWNER_ALERT_PHONE: ${{ vars.OWNER_ALERT_PHONE }}
        run: |
          set -euo pipefail
          : > /tmp/sync.env
          for k in JWT_SECRET JWT_REFRESH_SECRET WA_SECRET \
                   GROQ_API_KEY GROQ_API_KEY_2 GEMINI_API_KEY MISTRAL_API_KEY OPENROUTER_API_KEY \
                   GOOGLE_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_REDIRECT_URI \
                   RESEND_API_KEY EMAIL_PROVIDER SES_FROM SIGNUP_CODE \
                   GEOCODE_API_KEY OWNER_KEY OWNER_PORT OWNER_BIND OWNER_ALERT_PHONE; do
            v="${!k-}"
            if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v" >> /tmp/sync.env; fi
          done
          # Fixed MVP public contract (same as GCP frontend expects).
          # EMAIL_PROVIDER left empty on purpose: Resend rejects unverified domains and
          # PHONE_VERIFY follows RESOLVER_URL — for MVP allow immediate email/password
          # signup (Google Sign-In still works). Re-enable EMAIL_PROVIDER=resend when
          # cybercontrol.fun is verified in Resend.
          printf '%s\n' \
            'PUBLIC_DOMAIN=cybercontrol.fun' \
            'APP_ORIGIN=https://app.cybercontrol.fun' \
            'API_ORIGIN=https://api.cybercontrol.fun' \
            'CORS_ORIGINS=https://app.cybercontrol.fun,https://cybercontrol.fun,https://www.cybercontrol.fun' \
            'WA_SERVICE=http://whatsapp-service:3100' \
            'WA_INSTANCES=cybercontrol-wa' \
            'WA_INSTANCE_NAME=cybercontrol-wa' \
            'PARENT_URL=http://backend:3000' \
            'RESOLVER_URL=http://whatsapp-resolver:3200' \
            'WA_AUTH_BACKEND=postgres' \
            'EMAIL_PROVIDER=' \
            >> /tmp/sync.env

          echo "syncing $(grep -c '=' /tmp/sync.env) keys (values redacted)"
          scp -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i ~/.ssh/aws.pem \
            /tmp/sync.env "$HOST:/tmp/aws-mvp-sync.env"

          ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i ~/.ssh/aws.pem "$HOST" \
            'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/cybercontrol-docker
          upsert() {
            local k="$1" v="$2"
            awk -v k="$k" -v v="$v" '
              BEGIN { done=0 }
              $0 ~ ("^" k "=") { print k "=" v; done=1; next }
              { print }
              END { if (!done) print k "=" v }
            ' .env > .env.tmp && mv .env.tmp .env
          }
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            case "$line" in \#*) continue ;; esac
            k="${line%%=*}"
            v="${line#*=}"
            upsert "$k" "$v"
          done < /tmp/aws-mvp-sync.env
          rm -f /tmp/aws-mvp-sync.env
          # Do NOT touch POSTGRES_PASSWORD / REDIS_PASSWORD / TS_* — local MVP infra
          docker compose up -d --force-recreate backend extension-service
          sleep 10
          docker compose ps backend extension-service
          echo "=== container secret presence ==="
          docker compose exec -T backend sh -c 'for k in JWT_SECRET GOOGLE_CLIENT_ID OPENROUTER_API_KEY RESEND_API_KEY EMAIL_PROVIDER; do eval "v=\$$k"; if [ -n "$v" ]; then echo "$k=set"; else echo "$k=EMPTY"; fi; done'
          docker compose exec -T extension-service sh -c 'for k in JWT_SECRET OPENROUTER_API_KEY GROQ_API_KEY; do eval "v=\$$k"; if [ -n "$v" ]; then echo "$k=set"; else echo "$k=EMPTY"; fi; done'
          curl -fsS https://api.cybercontrol.fun/api/health; echo
          curl -fsS https://api.cybercontrol.fun/api/extension/health; echo
          curl -fsS https://api.cybercontrol.fun/api/auth/signup-config; echo
          REMOTE
          rm -f /tmp/sync.env
