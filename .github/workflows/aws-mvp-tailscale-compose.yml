name: AWS MVP Tailscale (compose)

# Injects Tailscale OAuth creds (same secrets GitHub runners use) into EC2
# /opt/cybercontrol-docker/.env and starts the Tailscale compose sidecar.
on:
  workflow_dispatch:
    inputs:
      host:
        description: "SSH host"
        type: string
        default: "ubuntu@44.219.62.198"

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Write SSH key
        env:
          KEY: ${{ secrets.AWS_MVP_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aws.pem
          chmod 600 ~/.ssh/aws.pem

      - name: Set Tailscale OAuth on host and start sidecar
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          if [ -z "${TS_OAUTH_CLIENT_ID:-}" ] || [ -z "${TS_OAUTH_SECRET:-}" ]; then
            echo "ERROR: TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET missing (runners use these)"
            exit 1
          fi

          {
            echo 'set -euo pipefail'
            printf 'CLIENT_ID=%q\n' "$TS_OAUTH_CLIENT_ID"
            printf 'CLIENT_SECRET=%q\n' "$TS_OAUTH_SECRET"
            printf 'AUTHKEY_FALLBACK=%q\n' "${TS_AUTHKEY:-}"
            cat <<'REMOTE'
          # Compose sidecar owns Tailscale — stop host agent so TUN is free
          systemctl stop tailscaled 2>/dev/null || true
          systemctl disable tailscaled 2>/dev/null || true
          pkill -9 tailscaled 2>/dev/null || true
          sleep 1

          cd /opt/cybercontrol-docker

          upsert_env() {
            local k="$1" v="$2"
            if grep -q "^${k}=" .env 2>/dev/null; then
              # Avoid sed corruption of secrets: rewrite via awk
              awk -v k="$k" -v v="$v" '
                BEGIN { done=0 }
                $0 ~ ("^" k "=") { print k "=" v; done=1; next }
                { print }
                END { if (!done) print k "=" v }
              ' .env > .env.tmp && mv .env.tmp .env
            else
              printf '%s=%s\n' "$k" "$v" >> .env
            fi
          }

          # OAuth path (same as tailscale/github-action on runners).
          # Clear stale auth key so the container does not prefer a bad TS_AUTHKEY.
          upsert_env TS_CLIENT_ID "$CLIENT_ID"
          upsert_env TS_CLIENT_SECRET "$CLIENT_SECRET"
          upsert_env TS_HOSTNAME cybercontrol-mvp
          upsert_env TS_EXTRA_ARGS '--advertise-tags=tag:cybercontrol --accept-dns=true'
          # Keep fallback around but empty it for the sidecar when OAuth is present
          upsert_env TS_AUTHKEY ''

          # Ensure compose file has OAuth env wiring (sync from this heredoc if old)
          if ! grep -q 'TS_CLIENT_ID' docker-compose.yml 2>/dev/null; then
            echo "WARNING: host compose file may be stale (no TS_CLIENT_ID). Patching env block via recreate still needs updated compose."
          fi

          docker compose pull tailscale
          # Fresh state avoids sticky NeedsLogin with a previously rejected key
          docker compose rm -sf tailscale || true
          docker volume rm cybercontrol-docker_tailscale-state 2>/dev/null || true
          docker compose up -d tailscale
          sleep 15
          docker compose ps tailscale
          docker compose logs tailscale --tail 80
          echo "=== status ==="
          docker compose exec -T tailscale tailscale --socket=/tmp/tailscaled.sock status 2>&1 | head -40 || true
          echo "=== ip ==="
          docker compose exec -T tailscale tailscale --socket=/tmp/tailscaled.sock ip -4 2>&1 || true
          REMOTE
          } | ssh -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i ~/.ssh/aws.pem "$HOST" "sudo bash -s"
