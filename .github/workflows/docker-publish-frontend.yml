name: Build and push frontend image

on:
  push:
    branches: [master]
    paths:
      - 'apps/frontend/**'
      - 'packages/media-viewer/**'
      - 'packages/media-tools/**'
      - '.github/workflows/docker-publish-frontend.yml'
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build frontend (Vite)
        working-directory: .
        env:
          VITE_API_URL: https://api.cybercontrol.fun/api
          VITE_SOCKET_URL: https://api.cybercontrol.fun
          VITE_GOOGLE_CLIENT_ID: 62092486976-jhsn62q3ufj4dvr42c1hpubnujasaqok.apps.googleusercontent.com
        run: pnpm --filter cybercontrol-frontend build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yashaswikaahuja/cybercontrol-frontend:latest
            ghcr.io/yashaswikaahuja/cybercontrol-frontend:${{ github.sha }}
