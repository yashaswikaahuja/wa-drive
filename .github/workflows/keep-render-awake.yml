name: Keep Render Backend Awake

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$RENDER_BACKEND_URL" ]; then
            echo "Missing RENDER_BACKEND_URL secret"
            exit 1
          fi

          HEALTH_URL="${RENDER_BACKEND_URL%/}/api/health"
          echo "Pinging $HEALTH_URL"
          curl --fail --silent --show-error --location "$HEALTH_URL"
