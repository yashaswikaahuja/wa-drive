name: Deploy (manual)

# Manual gate: builds happen automatically (CI), but deploys to the VMs only run when you
# trigger this from the Actions tab and pick a service + version. This is the free-tier equivalent
# of an approval gate (environment required-reviewers need a paid plan / public repo).
#
# Rollback: set `version` to a previous image tag (a commit SHA from a prior build) to redeploy
# that older version. Default `latest` deploys the newest build. One-at-a-time (recreate) strategy.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Service to deploy"
        type: choice
        options:
          - backend
          - extension-service
          - whatsapp-service
          - whatsapp-service-2
          - whatsapp-instance
          - backend-pool
          - whatsapp-pool
        default: backend
      version:
        description: "Image tag to deploy (latest, or a commit SHA to roll back)"
        type: string
        default: latest
      wa_host:
        description: "For target=whatsapp-instance: the VM's tailnet name (e.g. cybercontrol-wa-3)"
        type: string
        default: ""

jobs:
  # Turn the comma-separated host repo-variables into JSON arrays the matrix can consume.
  # Repo variables (Settings → Variables):
  #   BACKEND_HOSTS = cybercontrol-app,cybercontrol-app-2,...   (the backend pool)
  #   WA_HOSTS      = cybercontrol-wa,cybercontrol-wa-2,...      (the WhatsApp shard pool)
  # Empty / unset → that pool target produces an empty matrix and simply no-ops.
  prep:
    if: ${{ inputs.target == 'backend-pool' || inputs.target == 'whatsapp-pool' }}
    runs-on: ubuntu-latest
    outputs:
      backend_hosts: ${{ steps.parse.outputs.backend_hosts }}
      wa_hosts: ${{ steps.parse.outputs.wa_hosts }}
    steps:
      - id: parse
        env:
          BACKEND_HOSTS: ${{ vars.BACKEND_HOSTS }}
          WA_HOSTS: ${{ vars.WA_HOSTS }}
        run: |
          csv_to_json() { printf '%s' "$1" | tr ',' '\n' | sed 's/[[:space:]]//g' | grep -v '^$' | jq -R . | jq -cs .; }
          echo "backend_hosts=$(csv_to_json "$BACKEND_HOSTS")" >> "$GITHUB_OUTPUT"
          echo "wa_hosts=$(csv_to_json "$WA_HOSTS")" >> "$GITHUB_OUTPUT"

  backend:
    if: ${{ inputs.target == 'backend' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      host: cybercontrol-app
      compose_path: /opt/cybercontrol-docker/docker-compose.app.yml
      services: backend
      health_url: http://localhost:3000/api/health
      image_tag: ${{ inputs.version }}
      environment: backend
    secrets: inherit

  extension-service:
    if: ${{ inputs.target == 'extension-service' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      host: cybercontrol-app
      compose_path: /opt/cybercontrol-docker/docker-compose.app.yml
      services: extension-service
      health_url: http://localhost:3300/health
      image_tag: ${{ inputs.version }}
      environment: extension-service
    secrets: inherit

  whatsapp-service:
    if: ${{ inputs.target == 'whatsapp-service' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      host: cybercontrol-wa
      compose_path: /opt/cybercontrol-docker/docker-compose.wa.yml
      services: whatsapp-service
      health_url: http://localhost:3100/health
      image_tag: ${{ inputs.version }}
      environment: whatsapp-service
    secrets: inherit

  whatsapp-service-2:
    if: ${{ inputs.target == 'whatsapp-service-2' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      host: cybercontrol-wa-2
      compose_path: /opt/cybercontrol-docker/docker-compose.wa.yml
      services: whatsapp-service
      health_url: http://localhost:3100/health
      image_tag: ${{ inputs.version }}
      environment: whatsapp-service-2
    secrets: inherit

  # Generic shard: deploy any WhatsApp VM by passing wa_host — no per-instance env or job needed.
  # WA_INSTANCE_NAME is set to the host; uses the shared whatsapp-service environment for secrets.
  whatsapp-instance:
    if: ${{ inputs.target == 'whatsapp-instance' }}
    uses: ./.github/workflows/_deploy.yml
    with:
      host: ${{ inputs.wa_host }}
      compose_path: /opt/cybercontrol-docker/docker-compose.wa.yml
      services: whatsapp-service
      health_url: http://localhost:3100/health
      image_tag: ${{ inputs.version }}
      environment: whatsapp-service
      wa_instance_name: ${{ inputs.wa_host }}
    secrets: inherit

  # ── Rolling pool deploys ──────────────────────────────────────────────────
  # max-parallel: 1  → one host at a time (rolling, never all backends down at once).
  # fail-fast: true (default) → if a host's health-check fails in _deploy.yml, the rollout STOPS
  #   before touching the rest of the pool (and that host auto-rolls-back to its previous image).
  backend-pool:
    needs: prep
    if: ${{ inputs.target == 'backend-pool' && needs.prep.outputs.backend_hosts != '[]' }}
    strategy:
      max-parallel: 1
      matrix:
        host: ${{ fromJSON(needs.prep.outputs.backend_hosts) }}
    uses: ./.github/workflows/_deploy.yml
    with:
      host: ${{ matrix.host }}
      compose_path: /opt/cybercontrol-docker/docker-compose.app.yml
      services: backend
      health_url: http://localhost:3000/api/health
      image_tag: ${{ inputs.version }}
      environment: backend
    secrets: inherit

  whatsapp-pool:
    needs: prep
    if: ${{ inputs.target == 'whatsapp-pool' && needs.prep.outputs.wa_hosts != '[]' }}
    strategy:
      max-parallel: 1
      matrix:
        host: ${{ fromJSON(needs.prep.outputs.wa_hosts) }}
    uses: ./.github/workflows/_deploy.yml
    with:
      host: ${{ matrix.host }}
      compose_path: /opt/cybercontrol-docker/docker-compose.wa.yml
      services: whatsapp-service
      health_url: http://localhost:3100/health
      image_tag: ${{ inputs.version }}
      environment: whatsapp-service
      wa_instance_name: ${{ matrix.host }}
    secrets: inherit
