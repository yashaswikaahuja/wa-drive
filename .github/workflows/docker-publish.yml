name: Build and push backend image

on:
  push:
    branches: [master]
    paths:
      - 'apps/backend/**'
      - 'apps/owner-panel/**'
      - 'packages/backend-*/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Throwaway Postgres so the freshly-built image can actually BOOT in CI before we push it.
    # Catches "compiles but crashes on start" failures (e.g. a new lib missing a system dep)
    # at build time instead of on the VM at deploy time.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cc
          POSTGRES_PASSWORD: ccpass
          POSTGRES_DB: cybercontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Build the owner panel and drop its bundle into the backend build context so the image
      # can bake + serve it from the tailnet-only owner listener.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build owner panel into backend context
        run: |
          (cd apps/owner-panel && npm install --no-audit --no-fund && npm run build)
          rm -rf apps/backend/owner-panel-dist
          cp -r apps/owner-panel/dist apps/backend/owner-panel-dist
          echo "panel bundle:" && ls apps/backend/owner-panel-dist

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build the image and load it locally (do NOT push yet).
      # Monorepo: workspace packages live under packages/; context must be repo root.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile.monorepo
          platforms: linux/amd64
          load: true
          push: false
          tags: cybercontrol-backend:ci

      # 2. Smoke-test: boot the image against the throwaway Postgres and hit /api/health.
      #    Fails the job (so nothing is pushed) if the container can't start or stay healthy.
      - name: Smoke-test the built image
        run: |
          set -e
          docker run -d --name cc-smoke --network host \
            -e DATABASE_URL="postgresql://cc:ccpass@localhost:5432/cybercontrol" \
            -e JWT_SECRET=ci -e JWT_REFRESH_SECRET=ci -e WA_SECRET=ci \
            -e PORT=3000 \
            cybercontrol-backend:ci
          echo "waiting for /api/health…"
          ok=0
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::backend image failed to become healthy — not pushing"
            docker logs cc-smoke || true
            exit 1
          fi
          echo "✓ backend image healthy"
          docker rm -f cc-smoke >/dev/null 2>&1 || true

      # 3. Only now (smoke-test passed) push to GHCR.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/backend/Dockerfile.monorepo
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yashaswikaahuja/cybercontrol-backend:latest
            ghcr.io/yashaswikaahuja/cybercontrol-backend:${{ github.sha }}
