name: Build and push whatsapp images

on:
  push:
    branches: [master]
    paths:
      - 'apps/whatsapp-service/**'
      - 'apps/whatsapp-resolver/**'
      - 'packages/wa-*/**'
      - '.github/workflows/docker-publish-whatsapp.yml'
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Vendor WA packages into app dist/
        run: |
          pnpm --filter cybercontrol-whatsapp-service build
          pnpm --filter cybercontrol-whatsapp-resolver build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push whatsapp-service
        uses: docker/build-push-action@v6
        with:
          context: ./apps/whatsapp-service
          file: ./apps/whatsapp-service/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yashaswikaahuja/cybercontrol-whatsapp-service:latest
            ghcr.io/yashaswikaahuja/cybercontrol-whatsapp-service:${{ github.sha }}

      - name: Build and push whatsapp-resolver
        uses: docker/build-push-action@v6
        with:
          context: ./apps/whatsapp-resolver
          file: ./apps/whatsapp-resolver/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/yashaswikaahuja/cybercontrol-whatsapp-resolver:latest
            ghcr.io/yashaswikaahuja/cybercontrol-whatsapp-resolver:${{ github.sha }}
