name: Turborepo Safety

# Keeps the monorepo honest:
#   - apps/* for applications, packages/* for libraries
#   - NEW apps outside apps/ (or libs outside packages/) FAIL this workflow
#   - no CI-only discrete restores under apps/extension
#   - workflows point at apps/; turbo still builds
#
# Prefer fixing workflows/runners over copying old extension/ trees back.

on:
  push:
    branches: [master, main, 'debug/**', 'feat/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: turborepo-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast layout / path guards (no install) ───────────────────────────────
  layout-guards:
    name: Layout & CI path guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run turborepo safety check
        run: node tooling/turborepo-safety-check.mjs

  # ── Turbo build smoke (filtered, after guards) ───────────────────────────
  turbo-build:
    name: Turbo build smoke
    needs: layout-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Turbo build (backend + extension-service + wa packages)
        run: >
          pnpm exec turbo run build
          --filter=cybercontrol-backend...
          --filter=cybercontrol-extension-service...
          --filter=cybercontrol-whatsapp-service...
          --filter=@cc/shared
          --filter=@cc/background
          --filter=@cybercontrol/svc-fill-planner
          --filter=@cybercontrol/wa-service

  # ── Core turbo build + test (exclude peripheral apps that are not CD) ────
  # Landing / CLI are in the workspace but not part of the production image
  # pipeline; keep them out of the blocking safety gate until their builds
  # are maintained. Layout guards still protect the monorepo shape.
  turbo-pipeline:
    name: Turbo build + test (core)
    needs: layout-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Turbo build (core apps + packages)
        run: >
          pnpm exec turbo run build
          --filter=./apps/backend...
          --filter=./apps/extension...
          --filter=./apps/extension-service...
          --filter=./apps/frontend...
          --filter=./apps/whatsapp-service...
          --filter=./apps/whatsapp-resolver...
          --filter=./apps/owner-panel...
          --filter=./packages/*

      - name: Turbo test (core packages)
        run: >
          pnpm exec turbo run test
          --filter=./packages/*

      - name: Turbo typecheck (core)
        run: >
          pnpm exec turbo run typecheck
          --filter=./apps/backend...
          --filter=./packages/backend-*
        continue-on-error: true
