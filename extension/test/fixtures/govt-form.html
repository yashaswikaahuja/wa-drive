<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Test Application Form | Demo</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 20px auto; }
  .row { display: flex; gap: 16px; }
  .row > div { flex: 1; }
  .field { margin: 10px 0; }
  label { display: block; font-size: 13px; margin-bottom: 3px; }
  /* CSS reorder: this field appears AFTER in DOM but should render visually FIRST via order */
  .visual-first { order: -1; }
  .ng-dropdown { border: 1px solid #ccc; padding: 6px; cursor: pointer; }
  .ng-dropdown .label { font-size: 13px; color: #333; }
  .ng-dropdown .value-area { color: #888; }
</style>
</head>
<body>
<h1>Test Application Form</h1>
<form>
  <div class="field">
    <label for="fullname">Full Name (as per certificate)</label>
    <input type="text" id="fullname" name="fullname">
  </div>

  <div class="field">
    <label for="dob">Date of Birth</label>
    <input type="text" id="dob" name="dob" placeholder="DD/MM/YYYY">
  </div>

  <!-- Gender radio group -->
  <fieldset class="field">
    <legend>Gender</legend>
    <label><input type="radio" name="gender" value="M"> Male</label>
    <label><input type="radio" name="gender" value="F"> Female</label>
    <label><input type="radio" name="gender" value="T"> Transgender</label>
  </fieldset>

  <!-- Native select -->
  <div class="field">
    <label for="category">Category</label>
    <select id="category" name="category">
      <option value="">-- Select --</option>
      <option>General</option>
      <option>OBC (Non-Creamy Layer)</option>
      <option>SC</option>
      <option>ST</option>
    </select>
  </div>

  <!-- ng-dropdown style custom widget -->
  <div class="field ng-dropdown" data-cc-x="state">
    <div class="label">State</div>
    <div class="value-area"><span class="value">Select state</span></div>
  </div>

  <!-- Two-column address row: geometry must order left→right within the row -->
  <div class="row field">
    <div>
      <label for="district">District</label>
      <input type="text" id="district" name="district">
    </div>
    <div>
      <label for="pincode">Pincode</label>
      <input type="text" id="pincode" name="pincode">
    </div>
  </div>

  <!-- CSS-reordered row: DOM has A then B, but B is visually first -->
  <div class="row field">
    <div><label for="afieldB">City (visually second)</label><input type="text" id="afieldB" name="afieldB"></div>
    <div class="visual-first"><label for="afieldA">House No (visually first)</label><input type="text" id="afieldA" name="afieldA"></div>
  </div>

  <!-- Multi-checkbox group -->
  <fieldset class="field">
    <legend>Languages Known</legend>
    <label><input type="checkbox" name="languages" value="hi"> Hindi</label>
    <label><input type="checkbox" name="languages" value="en"> English</label>
    <label><input type="checkbox" name="languages" value="ur"> Urdu</label>
  </fieldset>

  <!-- Conditional yes/no radio -->
  <fieldset class="field">
    <legend>Are you an Ex-Serviceman?</legend>
    <label><input type="radio" name="exsm" value="yes"> Yes</label>
    <label><input type="radio" name="exsm" value="no"> No</label>
  </fieldset>

  <!-- Agreement checkbox -->
  <div class="field">
    <label><input type="checkbox" id="agree" name="agree"> I confirm the information provided is correct</label>
  </div>

  <button type="submit">Submit</button>
</form>
</body>
</html>
