<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { width: 280px; background: #0f172a; color: #e2e8f0; padding: 16px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .logo { width: 32px; height: 32px; border-radius: 8px; background: rgba(96,165,250,0.2); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .title { font-size: 13px; font-weight: 700; color: #60a5fa; }
    .subtitle { font-size: 10px; color: #64748b; }
    .status-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .status-row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.green { background: #22c55e; }
    .dot.red { background: #ef4444; }
    .status-text { font-size: 12px; font-weight: 600; }
    .status-detail { font-size: 11px; color: #94a3b8; margin-top: 4px; }
    .open-link { display: block; width: 100%; margin-top: 10px; padding: 9px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; text-decoration: none; }
    .open-link:hover { background: #1d4ed8; }
    .ver { font-size: 9px; color: #64748b; text-align: center; margin-top: 12px; }
    a { color: inherit; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <div class="title">CyberControl AutoFill</div>
      <div class="subtitle">Connected runtime client</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <div class="dot red" id="conn-dot"></div>
      <div class="status-text" id="conn-text">Not connected</div>
    </div>
    <div class="status-detail" id="conn-detail">Login to CyberControl in your browser</div>
  </div>

  <a href="https://frontend-pi-ochre-71.vercel.app" target="_blank" class="open-link">Open CyberControl Workspace →</a>

  <div class="ver" id="ver">v5.32</div>

  <script src="popup.js"></script>
</body>
</html>
