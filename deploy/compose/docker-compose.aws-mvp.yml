# Single-host AWS MVP (EC2): full stack on one box with classic MagicDNS names.
#
# Tailnet contract (same names as the old multi-VM mesh):
#   cybercontrol-app  → backend :3000, extension-service :3300, nginx :80
#   cybercontrol-db   → postgres :5432
#   cybercontrol-wa   → whatsapp-service :3100
#
# Internal compose traffic uses Docker DNS (postgres/redis/backend/whatsapp-*).
# Cross-node / runner / phone traffic uses MagicDNS names above.
#
# Resolver runs in-compose (OTP oracle). On multi-VM prod it stayed on the WA host
# via pm2; MVP keeps it containerized and reachable as whatsapp-resolver:3200.
#
# Deploy to /opt/cybercontrol-docker — OAuth in .env via aws-mvp-tailscale-compose.yml.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybercontrol
      POSTGRES_USER: cybercontrol_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Caps/devices live on postgres because tailscale-db uses network_mode: service:postgres
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybercontrol_app -d cybercontrol"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/yashaswikaahuja/cybercontrol-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whatsapp-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://cybercontrol_app:${POSTGRES_PASSWORD}@postgres:5432/cybercontrol
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WA_SECRET: ${WA_SECRET}
      WA_SERVICE: ${WA_SERVICE:-http://whatsapp-service:3100}
      WA_INSTANCES: ${WA_INSTANCES:-cybercontrol-wa}
      RESOLVER_URL: ${RESOLVER_URL:-http://whatsapp-resolver:3200}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://api.cybercontrol.fun/api/auth/google/callback}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-cybercontrol.fun}
      APP_ORIGIN: ${APP_ORIGIN:-https://app.cybercontrol.fun}
      API_ORIGIN: ${API_ORIGIN:-https://api.cybercontrol.fun}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.cybercontrol.fun,https://cybercontrol.fun,https://www.cybercontrol.fun}
    # Published so host-mode Tailscale (cybercontrol-app) can reach :3000 on the host.
    # Keep SG locked to 22/80 from the internet — do not open 3000 publicly.
    ports:
      - "3000:3000"

  extension-service:
    image: ghcr.io/yashaswikaahuja/cybercontrol-extension-service:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3300"
      DATABASE_URL: postgresql://cybercontrol_app:${POSTGRES_PASSWORD}@postgres:5432/cybercontrol
      JWT_SECRET: ${JWT_SECRET}
      DATA_DIR: /app/data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      BRAND_NAME: CyberControl
    volumes:
      - ext_data:/app/data
    ports:
      - "3300:3300"

  whatsapp-service:
    image: ghcr.io/yashaswikaahuja/cybercontrol-whatsapp-service:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WA_PORT: "3100"
      # Same-host: talk to backend over Docker DNS. Tailnet peers use cybercontrol-app:3000.
      PARENT_URL: ${PARENT_URL:-http://backend:3000}
      RESOLVER_URL: ${RESOLVER_URL:-http://whatsapp-resolver:3200}
      WA_SECRET: ${WA_SECRET}
      WA_AUTH_BACKEND: ${WA_AUTH_BACKEND:-postgres}
      WA_INSTANCE_NAME: ${WA_INSTANCE_NAME:-cybercontrol-wa}
      WA_HEARTBEAT_MS: ${WA_HEARTBEAT_MS:-20000}
      DATABASE_URL: postgresql://cybercontrol_app:${POSTGRES_PASSWORD}@postgres:5432/cybercontrol
      AUTH_DIR: /app/sessions
    volumes:
      - wa_sessions:/app/sessions
    # Caps for tailscale-wa (network_mode: service:whatsapp-service)
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  whatsapp-resolver:
    image: ghcr.io/yashaswikaahuja/cybercontrol-whatsapp-resolver:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3200"
      WA_SECRET: ${WA_SECRET}
    volumes:
      - wa_resolver_session:/app/session
      - wa_resolver_auth:/app/.wwebjs_auth
    expose:
      - "3200"
    # Chromium needs shm; without this wwebjs often crashes
    shm_size: "256mb"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - extension-service
    # Internal only — public 80/443 are owned by caddy (TLS).
    expose:
      - "80"
    volumes:
      - ./nginx-mvp.conf:/etc/nginx/conf.d/default.conf:ro

  # Public TLS edge (Let's Encrypt). Frontend at https://app.cybercontrol.fun
  # calls https://api.cybercontrol.fun — without this, browsers cannot connect.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.aws-mvp:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # MagicDNS: cybercontrol-app — owns host TUN. Do NOT also run host `tailscaled`.
  tailscale-app:
    image: tailscale/tailscale:stable
    hostname: cybercontrol-app
    restart: unless-stopped
    network_mode: host
    environment:
      TS_CLIENT_ID: ${TS_CLIENT_ID:-}
      TS_CLIENT_SECRET: ${TS_CLIENT_SECRET:-}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME_APP:-cybercontrol-app}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---advertise-tags=tag:cybercontrol --accept-dns=true}
      TS_ACCEPT_DNS: "true"
    volumes:
      - tailscale-app-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun

  # MagicDNS: cybercontrol-db — shares postgres netns so :5432 answers on this Tailscale IP.
  # Note: Docker forbids `hostname:` with network_mode: service:* — use TS_HOSTNAME only.
  tailscale-db:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TS_CLIENT_ID: ${TS_CLIENT_ID:-}
      TS_CLIENT_SECRET: ${TS_CLIENT_SECRET:-}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME_DB:-cybercontrol-db}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS_DB:---advertise-tags=tag:cybercontrol --accept-dns=false}
      TS_ACCEPT_DNS: "false"
    volumes:
      - tailscale-db-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun

  # MagicDNS: cybercontrol-wa — shares whatsapp-service netns so :3100 answers on this Tailscale IP.
  tailscale-wa:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    network_mode: service:whatsapp-service
    depends_on:
      whatsapp-service:
        condition: service_started
    environment:
      TS_CLIENT_ID: ${TS_CLIENT_ID:-}
      TS_CLIENT_SECRET: ${TS_CLIENT_SECRET:-}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME_WA:-cybercontrol-wa}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS_WA:---advertise-tags=tag:cybercontrol --accept-dns=false}
      TS_ACCEPT_DNS: "false"
    volumes:
      - tailscale-wa-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  pgdata:
  ext_data:
  wa_sessions:
  wa_resolver_session:
  wa_resolver_auth:
  caddy_data:
  caddy_config:
  tailscale-app-state:
  tailscale-db-state:
  tailscale-wa-state:
