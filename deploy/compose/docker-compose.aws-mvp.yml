# Single-host AWS MVP (EC2): all services on one box, classic MagicDNS names reclaimed.
#
# Tailnet contract (same names as the old multi-VM mesh):
#   cybercontrol-app  → backend :3000, extension-service :3300, nginx :80
#   cybercontrol-db   → postgres :5432
#   cybercontrol-wa*  → not on MVP yet (add when WA is restored)
#
# Internal compose traffic still uses Docker DNS (postgres/redis/backend).
# Cross-node / runner / phone traffic uses MagicDNS names above.
#
# Deploy to /opt/cybercontrol-docker — OAuth in .env via aws-mvp-tailscale-compose.yml.
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybercontrol
      POSTGRES_USER: cybercontrol_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Caps/devices live on postgres because tailscale-db uses network_mode: service:postgres
    # (capabilities apply to this netns so the sidecar can create TUN for inbound :5432).
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybercontrol_app -d cybercontrol"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ghcr.io/yashaswikaahuja/cybercontrol-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://cybercontrol_app:${POSTGRES_PASSWORD}@postgres:5432/cybercontrol
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WA_SECRET: ${WA_SECRET}
      WA_SERVICE: ${WA_SERVICE:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-https://api.cybercontrol.fun/api/auth/google/callback}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-cybercontrol.fun}
    # Published so host-mode Tailscale (cybercontrol-app) can reach :3000 on the host.
    # Keep SG locked to 22/80 from the internet — do not open 3000 publicly.
    ports:
      - "3000:3000"

  extension-service:
    image: ghcr.io/yashaswikaahuja/cybercontrol-extension-service:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3300"
      DATABASE_URL: postgresql://cybercontrol_app:${POSTGRES_PASSWORD}@postgres:5432/cybercontrol
      JWT_SECRET: ${JWT_SECRET}
      DATA_DIR: /app/data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      BRAND_NAME: CyberControl
    volumes:
      - ext_data:/app/data
    ports:
      - "3300:3300"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - extension-service
    ports:
      - "80:80"
    volumes:
      - ./nginx-mvp.conf:/etc/nginx/conf.d/default.conf:ro

  # MagicDNS: cybercontrol-app — owns host TUN. Do NOT also run host `tailscaled`.
  tailscale-app:
    image: tailscale/tailscale:stable
    hostname: cybercontrol-app
    restart: unless-stopped
    network_mode: host
    environment:
      TS_CLIENT_ID: ${TS_CLIENT_ID:-}
      TS_CLIENT_SECRET: ${TS_CLIENT_SECRET:-}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME_APP:-cybercontrol-app}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---advertise-tags=tag:cybercontrol --accept-dns=true}
      TS_ACCEPT_DNS: "true"
    volumes:
      - tailscale-app-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun

  # MagicDNS: cybercontrol-db — shares postgres netns so :5432 answers on this Tailscale IP.
  # Kernel TUN via caps/devices on postgres (required for inbound :5432). Userspace alone
  # joins MagicDNS but does not accept inbound TCP to the Tailscale IP.
  # Note: Docker forbids `hostname:` with network_mode: service:* — use TS_HOSTNAME only.
  tailscale-db:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TS_CLIENT_ID: ${TS_CLIENT_ID:-}
      TS_CLIENT_SECRET: ${TS_CLIENT_SECRET:-}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME_DB:-cybercontrol-db}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_AUTH_ONCE: "true"
      # accept-dns=false: only the app node should own host DNS
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS_DB:---advertise-tags=tag:cybercontrol --accept-dns=false}
      TS_ACCEPT_DNS: "false"
    volumes:
      - tailscale-db-state:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  pgdata:
  ext_data:
  tailscale-app-state:
  tailscale-db-state:
