# Deploy compose for the APP VM (cybercontrol-app): backend + extension-service.
# Pulls GHCR images; connects to the decoupled DB + WA service over the tailnet by name.
# Secrets come from /opt/cybercontrol-docker/.env on the host (NOT committed).
# Used by the CD pipeline (.github/workflows/_deploy.yml) and for manual deploys.
services:
  backend:
    image: ghcr.io/yashaswikaahuja/cybercontrol-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    network_mode: host          # so the container reaches the tailnet (100.x / MagicDNS)
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}              # postgresql://...@cybercontrol-db:5432/cybercontrol
      REDIS_URL: ${REDIS_URL:-}                  # set → multi-instance socket.io fanout + QR cache; empty → in-memory (single)
      WA_SERVICE: ${WA_SERVICE:-http://cybercontrol-wa:3100}
      WA_INSTANCES: ${WA_INSTANCES:-}            # empty = single-instance; csv for sharding
      WA_DEAD_AFTER_MS: ${WA_DEAD_AFTER_MS:-90000}   # instance dead after this w/o heartbeat → failover
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WA_SECRET: ${WA_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      RESOLVER_URL: ${RESOLVER_URL:-}            # wwebjs oracle → sends phone signup/verify OTPs
      SIGNUP_CODE: ${SIGNUP_CODE:-}              # optional invite gate (empty → open signup)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}        # 'resend' | 'ses' | '' — auto-picks resend if key set
      RESEND_API_KEY: ${RESEND_API_KEY:-}        # Resend HTTP API key (no sandbox) → email OTP + welcome
      SES_FROM: ${SES_FROM:-}                    # verified sender identity / from-address (used by both providers)
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      OWNER_KEY: ${OWNER_KEY:-}                   # tailnet owner-panel credential (empty → owner API off)
      OWNER_PORT: ${OWNER_PORT:-}                 # owner listener port, e.g. 3010 (empty → off)
      OWNER_BIND: ${OWNER_BIND:-}                 # 'auto' → bind this VM's tailscale IP
      OWNER_ALERT_PHONE: ${OWNER_ALERT_PHONE:-}   # owner WhatsApp for daily health-drop digest (empty → no alerts)
      GEOCODE_API_KEY: ${GEOCODE_API_KEY:-}       # server-side reverse-geocode of GPS captures

  extension-service:
    image: ghcr.io/yashaswikaahuja/cybercontrol-extension-service:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "3300"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}                  # MUST match backend
      DATA_DIR: /app/data
    volumes:
      - ext_data:/app/data

volumes:
  ext_data:
