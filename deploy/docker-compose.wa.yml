# Deploy compose for the WhatsApp VM (cybercontrol-wa): whatsapp-service ONLY.
# Pulls the GHCR image. DB-backed Baileys auth (WA_AUTH_BACKEND=postgres) makes sessions
# survive container/instance moves; PARENT_URL reaches the backend over the tailnet.
#
# NOTE: the whatsapp-RESOLVER is intentionally NOT here. It uses whatsapp-web.js, which allows
# only ONE active session per account — running a copied session in a container logs the account
# out (WhatsApp duplicate-session detection). The resolver is a single non-scaling lookup oracle,
# so it stays on pm2 on the host. Do not containerize it.
# Secrets come from the host .env (NOT committed).
services:
  whatsapp-service:
    image: ghcr.io/yashaswikaahuja/cybercontrol-whatsapp-service:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      WA_PORT: "3100"
      PARENT_URL: ${PARENT_URL:-http://cybercontrol-app:3000}
      RESOLVER_URL: ${RESOLVER_URL:-http://localhost:3200}   # resolver runs on the host (pm2)
      WA_SECRET: ${WA_SECRET}
      WA_AUTH_BACKEND: ${WA_AUTH_BACKEND:-postgres}
      WA_INSTANCE_NAME: ${WA_INSTANCE_NAME:-}    # this instance's tailnet name → heartbeat + boot resume
      WA_HEARTBEAT_MS: ${WA_HEARTBEAT_MS:-20000}
      DATABASE_URL: ${DATABASE_URL}              # postgresql://...@cybercontrol-db:5432/cybercontrol
      AUTH_DIR: /app/sessions
    volumes:
      - wa_sessions:/app/sessions                # only used if WA_AUTH_BACKEND=files

volumes:
  wa_sessions:
