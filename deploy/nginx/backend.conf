# Blue-green front for the backend on cybercontrol-app.
# nginx listens on :3000 (where external api.cybercontrol.fun traffic arrives) and proxies to
# whichever backend color is "active". The active upstream is in active_upstream.conf, which the
# switch script rewrites + reloads — an atomic cutover with the old color still running for rollback.
# (active_upstream.conf is auto-loaded by the stock nginx.conf `include conf.d/*.conf`.)

server {
    listen 3000;
    server_name _;

    # socket.io / WebSocket support (backend uses socket.io)
    location / {
        proxy_pass http://backend_active;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        client_max_body_size 50m;
    }
}
