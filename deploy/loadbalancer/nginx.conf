# CyberControl load-balancer (the "parent" tier).
#
# Spreads traffic across MULTIPLE backend + extension-service instances so load distributes evenly
# and any single instance can die without taking the platform down. This is the front door; the
# instances behind it are interchangeable because all shared state lives in Postgres + Redis:
#   • socket.io realtime events  → Redis adapter (REDIS_URL) fans events across all backends
#   • WhatsApp QR cache           → Redis (REDIS_URL)
#   • form_mappings / adapters    → Postgres (ext_kv_store)
#
# Balancing strategy:
#   /api/*        least_conn  — stateless requests, send each to the least-busy instance.
#   /socket.io/*  ip_hash     — a websocket is a long-lived connection that must stay pinned to ONE
#                              backend (you can't round-robin packets of one socket). ip_hash keeps a
#                              client on the same backend; the Redis adapter still delivers events
#                              emitted by OTHER backends. (For real client-IP stickiness behind another
#                              proxy/CDN, switch to a cookie-based sticky method.)

upstream backend_pool {
    least_conn;
    server backend-1:3000 max_fails=3 fail_timeout=15s;
    server backend-2:3000 max_fails=3 fail_timeout=15s;
    # add more backends here — they are interchangeable
}

upstream backend_ws {
    ip_hash;                       # sticky: one socket -> one backend
    server backend-1:3000;
    server backend-2:3000;
}

upstream ext_pool {
    least_conn;
    server ext-1:3300 max_fails=3 fail_timeout=15s;
    server ext-2:3300 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # extension-service routes (stateless; mappings/adapters now in shared Postgres)
    location /api/profiles    { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; }
    location /api/mappings    { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; }
    location /api/adapters    { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; }
    location /api/sessions    { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; }
    location /api/corrections { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; }
    location /api/training    { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; }
    location /api/agent       { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; proxy_read_timeout 60s; }
    location /api/fill-plan   { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; proxy_read_timeout 90s; }
    location /api/fill-observation { proxy_pass http://ext_pool; include /etc/nginx/lb_proxy_params; }
    location /api/semantic-map { proxy_pass http://ext_pool;    include /etc/nginx/lb_proxy_params; proxy_read_timeout 90s; }
    location /api/sync        { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; }
    location /api/knowledge   { proxy_pass http://ext_pool;     include /etc/nginx/lb_proxy_params; }
    location /api/extension/health { proxy_pass http://ext_pool; include /etc/nginx/lb_proxy_params; }

    # Extension WSS protocol (T4) — extension-service attachWebSocket path /ws
    location /ws {
        proxy_pass http://ext_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # Socket.IO - sticky upstream + websocket upgrade
    location /socket.io/ {
        proxy_pass http://backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # Everything else (the rest of /api and app) -> least-busy backend
    location / {
        proxy_pass http://backend_pool;
        include /etc/nginx/lb_proxy_params;
    }
}
