apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cybercontrol
spec:
  selector:
    app: backend
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cybercontrol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          imagePullPolicy: IfNotPresent
          image: cybercontrol/backend:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: cybercontrol-config
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: JWT_REFRESH_SECRET
            - name: WA_SECRET
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: WA_SECRET
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: GROQ_API_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: GOOGLE_REDIRECT_URI
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
