apiVersion: v1
kind: Service
metadata:
  name: extension-service
  namespace: cybercontrol
spec:
  selector:
    app: extension-service
  ports:
    - port: 3300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extension-service
  namespace: cybercontrol
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extension-service
  template:
    metadata:
      labels:
        app: extension-service
    spec:
      containers:
        - name: extension-service
          imagePullPolicy: IfNotPresent
          image: cybercontrol/extension-service:latest
          ports:
            - containerPort: 3300
          env:
            - name: PORT
              value: "3300"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cybercontrol-secrets
                  key: JWT_SECRET
            - name: DATA_DIR
              value: "/app/data"
          volumeMounts:
            - name: ext-data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: ext-data
          persistentVolumeClaim:
            claimName: ext-data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ext-data-pvc
  namespace: cybercontrol
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
