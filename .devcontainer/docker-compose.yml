# Local-only Postgres for Codespaces / test/local-codespace branch.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybercontrol_local
      POSTGRES_PASSWORD: cybercontrol_local_dev
      POSTGRES_DB: cybercontrol_local
    ports:
      - "5432:5432"
    volumes:
      - cc_pg_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybercontrol_local -d cybercontrol_local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cc_pg_local:
