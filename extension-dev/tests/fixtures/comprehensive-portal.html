<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CyberControl Test Portal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f3f4f6;color:#111;line-height:1.45;padding-bottom:90px;font-size:15px}
header{background:#1e3a8a;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:50}
header h1{font-size:1.05rem}
header p{font-size:.75rem;opacity:.85;margin-top:2px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.tabs button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 10px;border-radius:20px;font-size:.72rem;cursor:pointer}
.tabs button.active{background:#fff;color:#1e3a8a}
main{max-width:720px;margin:0 auto;padding:12px}
.sec{display:none;background:#fff;border-radius:8px;padding:14px;margin-bottom:12px;border:1px solid #ddd}
.sec.active{display:block}
.sec h2{font-size:1.05rem;color:#1e3a8a;border-bottom:2px solid #1a56db;padding-bottom:6px;margin-bottom:12px}
.sec h3{font-size:.9rem;margin:14px 0 8px;color:#374151}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:520px){.grid{grid-template-columns:1fr 1fr}}
.fg{display:flex;flex-direction:column;gap:3px}
.fg.full{grid-column:1/-1}
label{font-size:.78rem;font-weight:600;color:#374151}
label .r{color:#c81e1e}
input,select,textarea,button{font:inherit;font-size:.88rem}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=tel],
input[type=url],input[type=search],input[type=date],input[type=datetime-local],input[type=time],
input[type=month],input[type=week],input[type=file],select,textarea{
  width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;background:#fff
}
input:focus,select:focus,textarea:focus{outline:none;border-color:#1a56db;box-shadow:0 0 0 2px rgba(26,86,219,.2)}
.hint{font-size:.68rem;color:#6b7280}
.err{font-size:.68rem;color:#c81e1e;display:none}.err.show{display:block}
.btn{display:inline-flex;align-items:center;padding:8px 14px;border:none;border-radius:6px;font-weight:600;font-size:.82rem;cursor:pointer}
.btn-p{background:#1a56db;color:#fff}.btn-s{background:#057a55;color:#fff}
.btn-d{background:#c81e1e;color:#fff}.btn-o{background:#fff;border:1px solid #ccc;color:#111}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
fieldset{border:1px solid #ddd;border-radius:6px;padding:10px;margin-bottom:10px}
legend{font-weight:700;font-size:.82rem;padding:0 6px;color:#1e3a8a}
.cg,.rg{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:4px}
.cg label,.rg label{display:flex;align-items:center;gap:4px;font-weight:400;cursor:pointer}
.cond{display:none}.cond.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:36px;padding:4px;border:1px solid #ccc;border-radius:6px;background:#fff}
.chip{background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:12px;font-size:.72rem;display:flex;align-items:center;gap:3px}
.chip button{background:none;border:none;cursor:pointer;color:#1e40af;font-size:.9rem}
.sw{position:relative;width:40px;height:22px;display:inline-block}
.sw input{opacity:0;width:0;height:0}
.sw .sl{position:absolute;inset:0;background:#ccc;border-radius:22px;cursor:pointer;transition:.2s}
.sw .sl:before{content:"";position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+.sl{background:#1a56db}
.sw input:checked+.sl:before{transform:translateX(18px)}
.otp{display:flex;gap:6px}
.otp input{width:38px;height:44px;text-align:center;font-size:1.2rem;font-weight:700}
.pin{display:flex;gap:5px}
.pin input{width:34px;height:38px;text-align:center;font-size:1.05rem}
canvas.sig{border:2px dashed #ccc;border-radius:6px;background:#fafafa;touch-action:none;width:100%;max-width:360px;height:120px}
.preview{margin-top:6px;max-width:120px;max-height:90px;border-radius:4px;border:1px solid #ddd;display:none}
.drop{border:2px dashed #ccc;border-radius:8px;padding:16px;text-align:center;color:#6b7280;cursor:pointer}
.drop.over{border-color:#1a56db;background:#eff6ff}
.drop input{display:none}
.wiz-bar{display:flex;gap:3px;margin-bottom:12px}
.wiz-ind{flex:1;text-align:center;font-size:.65rem;padding:5px 2px;background:#e5e7eb;color:#6b7280;border-radius:3px}
.wiz-ind.on{background:#1a56db;color:#fff;font-weight:600}
.wiz-ind.done{background:#057a55;color:#fff}
.wiz-p{display:none}.wiz-p.on{display:block}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th,td{border:1px solid #ddd;padding:5px 6px;text-align:left}
th{background:#f3f4f6;cursor:pointer}
tr:nth-child(even){background:#f9fafb}
.ed input{width:100%;border:1px solid transparent;background:transparent;padding:2px}
.ed input:focus{border-color:#1a56db;background:#fff}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:16px;max-width:360px;width:92%;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.modal h3{margin-bottom:8px}
.modal p{font-size:.85rem;color:#6b7280;margin-bottom:12px}
.rep{border:1px solid #ddd;border-radius:6px;padding:10px;margin-bottom:8px;background:#fafafa;position:relative}
.rep .rm{position:absolute;top:6px;right:6px}
.ok-page{text-align:center;padding:28px 10px}
.ok-page .ref{font-size:1.3rem;font-weight:700;color:#057a55;margin:10px 0;letter-spacing:1px}
#dbg{position:fixed;bottom:0;right:0;width:min(300px,100%);max-height:180px;background:#111827;color:#e5e7eb;font-family:monospace;font-size:.65rem;border-radius:8px 0 0 0;z-index:200;overflow:hidden}
#dbg .hd{background:#1f2937;padding:5px 10px;display:flex;justify-content:space-between;cursor:pointer}
#dbg .bd{padding:6px 10px;overflow-y:auto;max-height:140px;line-height:1.35}
#dbg .ln{margin-bottom:2px;border-bottom:1px solid #1f2937;padding-bottom:1px}
.str{height:5px;border-radius:3px;background:#e5e7eb;margin-top:3px;overflow:hidden}
.str div{height:100%;width:0;transition:width .25s,background .25s}
.cs-wrap{position:relative}
.cs-trig{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;display:flex;justify-content:space-between}
.cs-drop{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;border-radius:6px;max-height:180px;overflow-y:auto;z-index:40;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.cs-drop.open{display:block}
.cs-search{width:100%;padding:7px;border:none;border-bottom:1px solid #ddd}
.cs-opt{padding:6px 10px;cursor:pointer}.cs-opt:hover{background:#eff6ff}
progress,meter{width:100%;height:16px}
.delay{opacity:0;transition:opacity .3s}.delay.vis{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>

  <p>Mobile-optimized · extraction · mapping · DOM · ActionPlan · stress</p>
  <nav class="tabs" id="nav">

</header>

(function(){var w=$('#cs-c');if(!w)return;var t=w.querySelector('.cs-trig'),d=w.querySelector('.cs-drop'),s=w.querySelector('.cs-search'),h=$('#cs-c-v'),lab=w.querySelector('.cs-lab');

function chips(cid,iid,hid){var box=$(cid),inp=$(iid),h=$(hid),tags=[];
function ren(){$$('.chip',box).forEach(function(c){c.parentNode.removeChild(c)});tags.forEach(function(t,i){var c=document.createElement('span');c.className='chip';c.innerHTML=t+' <button type="button">×</button>';c.querySelector('button').addEventListener('click',function(){tags.splice(i,1);ren()});box.insertBefore(c,inp)});if(h)h.value=tags.join(',')}
inp.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===','){e.preventDefault();var v=inp.value.trim().replace(/,/g,'');if(v&&tags.indexOf(v)<0){tags.push(v);ren()}inp.value=''}if(e.key==='Backspace'&&!inp.value&&tags.length){tags.pop();ren()}})}
if($('#j-sk-in'))chips('#j-sk-chips','#j-sk-in','#j-skills');
function digits(sel,hid){var boxes=$$(sel),h=$(hid);boxes.forEach(function(b,i){b.addEventListener('input',function(){b.value=b.value.replace(/\D/g,'').slice(0,1);if(b.value&&i<boxes.length-1)boxes[i+1].focus();if(h)h.value=boxes.map(function(x){return x.value}).join('')});b.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!b.value&&i>0)boxes[i-1].focus()})})}
digits('#otp-g .ob','#otp-v');digits('#pin-g .pb','#pin-v');
(function(){var c=$('#sig');if(!c)return;var ctx=c.getContext('2d'),dr=false;ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.lineCap='round';
function pos(e){var r=c.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
function st(e){e.preventDefault();dr=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}
function mv(e){if(!dr)return;e.preventDefault();var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()}
function en(){dr=false}
c.addEventListener('mousedown',st);c.addEventListener('mousemove',mv);c.addEventListener('mouseup',en);c.addEventListener('mouseleave',en);
c.addEventListener('touchstart',st,{passive:false});c.addEventListener('touchmove',mv,{passive:false});c.addEventListener('touchend',en);
$('#sig-clr').addEventListener('click',function(){ctx.clearRect(0,0,c.width,c.height);$('#sig-d').value=''});
$('#sig-sv').addEventListener('click',function(){$('#sig-d').value=c.toDataURL()});
})();
var ws=1,WT=6;
function updWiz(){
  $$('.wiz-p').forEach(function(p){p.classList.toggle('on',+p.getAttribute('data-st')===ws)});
  $$('.wiz-ind').forEach(function(ind){var s=+ind.getAttribute('data-st');ind.classList.toggle('on',s===ws);ind.classList.toggle('done',s<ws)});
  $('#w-prev').disabled=ws===1;$('#w-next').style.display=ws===WT?'none':'';$('#w-sub').style.display=ws===WT?'':'none';
  if(ws===6)$('#w-rev').innerHTML='<b>Name:</b> '+($('#w-name').value||'—')+'<br><b>Mobile:</b> '+($('#w-mob').value||'—')+'<br><b>Email:</b> '+($('#w-email').value||'—')+'<br><b>City:</b> '+($('#w-city').value||'—');
}
function valWiz(){var panel=$('.wiz-p[data-st="'+ws+'"]'),req=$$('[required]',panel),ok=true;req.forEach(function(f){if(!f.value||(f.type==='checkbox'&&!f.checked)){f.style.borderColor='#c81e1e';ok=false}else f.style.borderColor=''});return ok}
$('#w-next').addEventListener('click',function(){if(!valWiz())return;if(ws<WT){ws++;updWiz()}});
$('#w-prev').addEventListener('click',function(){if(ws>1){ws--;updWiz()}});
