<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perception Test — Native HTML5 Form</title>
</head>
<body>
  <h1>Registration Form</h1>
  <form id="reg-form" action="#" method="POST">
    <fieldset>
      <legend>Personal Information</legend>

      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="full_name" placeholder="Enter your name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="phone">Mobile Number</label>
      <input type="tel" id="phone" name="mobile" placeholder="9876543210">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob">

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">-- Select --</option>
        <option value="gen">General</option>
        <option value="obc">OBC</option>
        <option value="sc">SC</option>
        <option value="st">ST</option>
      </select>

      <label for="photo">Upload Photo</label>
      <input type="file" id="photo" name="photo" accept="image/*">
    </fieldset>

    <fieldset>
      <legend>Gender</legend>
      <label><input type="radio" name="gender" value="M"> Male</label>
      <label><input type="radio" name="gender" value="F"> Female</label>
      <label><input type="radio" name="gender" value="O"> Other</label>
    </fieldset>

    <fieldset>
      <legend>Preferences</legend>
      <label><input type="checkbox" name="terms" value="yes" required> I agree to terms</label>
      <label><input type="checkbox" name="newsletter" value="yes"> Subscribe to newsletter</label>
    </fieldset>

    <textarea id="address" name="address" rows="3" placeholder="Enter address"></textarea>

    <button type="submit">Submit Application</button>
    <button type="reset">Reset</button>
  </form>
</body>
</html>
