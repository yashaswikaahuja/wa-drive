<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Photos proof</title>
<style>
body{margin:0;background:#0f1218;font-family:Inter,system-ui,sans-serif}
.stage{width:1280px;height:720px;margin:0 auto;padding:28px;box-sizing:border-box}
.chrome{background:#111;color:#fff;border-radius:16px 16px 0 0;padding:12px 16px;font:600 13px Inter}
.board{background:#f3efe7;padding:28px;height:640px;border-radius:0 0 16px 16px;display:flex;align-items:center;justify-content:center;gap:40px}
.box{background:#fff;border:1px dashed #d6d3d1;border-radius:16px;padding:16px;text-align:center}
.box.ready{border:2px solid #14b8a6;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.ph{width:110px;height:140px;margin:8px auto;border-radius:6px;background:linear-gradient(135deg,#a8a29e,#78716c)}
.ready .ph{width:92px;height:118px;background:linear-gradient(135deg,#e7e5e4,#a8a29e);position:relative}
.ready .ph:after{content:'4.5 × 3.5 cm';position:absolute;left:0;right:0;bottom:0;background:#f5f5f4;font:10px ui-monospace;padding:4px}
.arrow{font-size:28px;color:#ea580c;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:translateX(6px)}}
.list{font-size:14px;color:#444;line-height:1.8}
</style></head>
<body><div class="stage">
<div class="chrome">CyberControl · Photo & PDF Tools · silent clip</div>
<div class="board">
  <div class="box"><div style="font:600 11px Inter;color:#777;text-transform:uppercase">Before</div><div class="ph"></div></div>
  <div class="arrow">→</div>
  <div class="box ready"><div style="font:600 11px Inter;color:#0f766e;text-transform:uppercase">Print ready</div><div class="ph"></div></div>
  <div class="list"><b style="color:#111">Passport size</b><br>✓ White background<br>✓ Exact dimensions<br>✓ PDF / print export</div>
</div></div></body></html>
