<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>Customers proof</title>
<style>
body{margin:0;background:#0f1218;font-family:Inter,system-ui,sans-serif}
.stage{width:1280px;height:720px;margin:0 auto;padding:28px;box-sizing:border-box}
.chrome{background:#111;color:#fff;border-radius:16px 16px 0 0;padding:12px 16px;font:600 13px Inter}
.board{background:#f3efe7;padding:20px;height:640px;border-radius:0 0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:1px solid #e7e5e4;border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;opacity:0;animation:in .45s forwards}
.card:nth-child(1){animation-delay:.2s}.card:nth-child(2){animation-delay:.5s}.card:nth-child(3){animation-delay:.8s}.card:nth-child(4){animation-delay:1.1s}
.av{width:44px;height:44px;border-radius:999px;background:#ffedd5;color:#c2410c;display:grid;place-items:center;font:700 13px Inter}
@keyframes in{to{opacity:1}}
</style></head>

</div></div></body></html>
