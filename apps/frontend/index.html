<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CyberControl Hub</title>
  <!-- Critical paint: never leave phone Chrome on a blank white void while fonts/JS load. -->
  <style>
    html, body, #root { min-height: 100%; margin: 0; background: #f7f3eb; color: #121a2b; }
    html[data-theme="dark"], html[data-theme="dark"] body, html[data-theme="dark"] #root {
      background: #111820; color: #f3eee6;
    }
    #cc-boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      font: 500 14px system-ui, -apple-system, sans-serif; color: #3a4558;
      pointer-events: none; z-index: 0;
    }
    html[data-theme="dark"] #cc-boot { color: #a39a8c; }
    #cc-boot .spin {
      width: 28px; height: 28px; border-radius: 999px;
      border: 2px solid rgba(242, 140, 40, 0.25); border-top-color: #f28c28;
      animation: ccspin 0.7s linear infinite;
    }
    @keyframes ccspin { to { transform: rotate(360deg); } }
    #cc-boot-fail { display: none; pointer-events: auto; text-align: center; padding: 24px; max-width: 22rem; }
    #cc-boot-fail button {
      margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 999px;
      background: #f28c28; color: #fff; font: 600 13px system-ui, sans-serif;
    }
  </style>
  <!-- Theme before paint — avoids cream flash when dark/system is preferred. -->
  <script>
    (function () {
      try {
        var p = localStorage.getItem('cc-theme') || 'system';
        var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <!-- Fonts: non-blocking. CSS @import was stalling first paint on slow/restricted mobile networks. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" />
  </noscript>
</head>
<body>
  <div id="root">
    <div id="cc-boot" aria-live="polite">
      <div class="spin" aria-hidden="true"></div>
      <div>Opening CyberControl…</div>
      <div id="cc-boot-fail">
        <div>Couldn’t open the Hub on this phone.</div>
        <button type="button" id="cc-boot-reload">Clear cache &amp; retry</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var reloaded = false;
      try { reloaded = sessionStorage.getItem('cc-boot-reloaded') === '1'; } catch (e) {}
      function clearAndReload() {
        var done = function () {
          try { sessionStorage.setItem('cc-boot-reloaded', '1'); } catch (e) {}
          location.reload();
        };
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }));
        }
        if (window.caches && caches.keys) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        Promise.all(tasks).then(done).catch(done);
      }
      var fail = document.getElementById('cc-boot-fail');
      var btn = document.getElementById('cc-boot-reload');
      if (btn) btn.addEventListener('click', clearAndReload);
      // If the JS module never boots, show recovery (stale SW / failed chunk on phone Chrome).
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root) return;
        if (root.dataset && root.dataset.booted === '1') return;
        if (root.querySelector('#login-identity, .pt-paper, #cc-auth-ready')) return;
        if (fail) fail.style.display = 'block';
        if (!reloaded) clearAndReload();
      }, 10000);
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
