# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CyberControl Extension ↔ Service Protocol
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# This is the communication contract between the two runtimes.
# The service produces ActionPlans. The extension produces Observations.
# All communication flows through these message types only.
#
# NO other message shapes are permitted across the boundary.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

version: 1

# ── Direction: Service → Extension ───────────────────────────────────

planner_output:
  type: ActionPlan
  description: >
    An ordered list of actions the extension must execute.
    Generated by the service planner. The extension does not
    interpret, reorder, or filter — it executes sequentially.
  schema:
    id: string          # unique plan ID
    session_id: string  # fill session reference
    actions:
      type: array
      items:
        action:
          type: string  # action verb from allowed_actions
          selector: string  # CSS selector or element reference
          value: string | null  # value to apply (null for clicks/waits)
          options: object | null  # action-specific config
          timeout_ms: integer  # max time for this action
          on_failure: enum [skip, retry, abort, replan]

# ── Direction: Extension → Service ───────────────────────────────────

extension_output:
  type: Observation
  description: >
    The extension reports what happened after executing actions.
    The service uses observations to learn, re-plan, or record.
  schema:
    plan_id: string         # which plan was executed
    session_id: string      # fill session reference
    results:
      type: array
      items:
        action_index: integer   # which action in the plan
        status: enum [success, failed, skipped, timeout]
        actual_value: string | null  # what the field ended up with
        error: string | null    # failure reason if any
    corrections:
      type: array
      items:
        selector: string
        original_value: string
        corrected_value: string
        timestamp: integer
    page_state:
      url: string
      navigated: boolean     # did page navigate during execution
      form_submitted: boolean

# ── Allowed message types ────────────────────────────────────────────

allowed_messages:
  - name: Execute
    direction: service → extension
    payload: ActionPlan
    description: "Service tells extension to execute a fill plan"

  - name: Observe
    direction: extension → service
    payload: Observation
    description: "Extension reports execution results back to service"

  - name: CapabilityResult
    direction: extension → service
    payload:
      capabilities:
        type: array
        items: string  # e.g. "fill_text", "select_option", "click", "wait_network"
    description: "Extension declares what actions it can execute"

  - name: Error
    direction: bidirectional
    payload:
      code: string        # machine-readable error code
      message: string     # human-readable description
      recoverable: boolean
    description: "Either side reports an unrecoverable or degraded state"

# ── Allowed action vocabulary ────────────────────────────────────────
# The extension ONLY executes these. The service ONLY plans with these.
# Adding a new action requires updating both runtimes.

allowed_actions:
  - fill_text:
      description: "Type a value into a text/textarea input"
      requires: [selector, value]

  - select_option:
      description: "Select a dropdown option by value or fuzzy match"
      requires: [selector, value]
      options: [exact, fuzzy, index]

  - click:
      description: "Click an element (button, radio, checkbox, link)"
      requires: [selector]
      options: [double, right]

  - check:
      description: "Set checkbox/radio to checked or unchecked"
      requires: [selector, value]  # value = "true" | "false"

  - wait_network:
      description: "Wait for network idle"
      requires: []
      options: [quiet_ms, max_ms]

  - wait_element:
      description: "Wait for an element to appear in DOM"
      requires: [selector]
      options: [timeout_ms, visible]

  - wait_time:
      description: "Fixed delay"
      requires: []
      options: [ms]

  - scroll_to:
      description: "Scroll element into view"
      requires: [selector]

  - upload_file:
      description: "Trigger file input and upload"
      requires: [selector, value]  # value = file path or base64

  - extract:
      description: "Read current page state and return to service"
      requires: []
      options: [fields_only, full_dom, screenshot]

  - navigate:
      description: "Navigate to a URL"
      requires: [value]  # value = URL

  - assert:
      description: "Verify a condition (value matches, element exists)"
      requires: [selector]
      options: [expected_value, exists, visible]

# ── Protocol rules ───────────────────────────────────────────────────

rules:
  - "Extension MUST NOT generate actions — only execute them"
  - "Extension MUST NOT interpret action semantics beyond execution"
  - "Extension MUST report every action result, including skipped ones"
  - "Service MUST NOT send actions outside allowed_actions vocabulary"
  - "Service MUST include on_failure for every action"
  - "New actions require version bump and both-side implementation"
  - "Extension MAY refuse actions not in its declared capabilities"

# ── Degraded mode ────────────────────────────────────────────────────

degraded_mode:
  trigger: "Service unreachable for > 3 seconds"
  behavior: >
    Extension uses last cached ActionPlan for this form (if available).
    If no cache exists, extension shows "Service unavailable" to operator.
    Extension NEVER generates its own plan in degraded mode.
  cache_key: "form_key + profile_id"
  cache_ttl: "7 days"
