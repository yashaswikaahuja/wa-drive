# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CyberControl Phase Freeze Rules
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Frozen phases have stabilized code that must not be casually modified.
# Changes to frozen files require explicit justification in the PR.
#
# This is NOT a hard block — it's a review gate.
# CI will WARN (not fail) when frozen files are touched.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

version: "1.0"

phases:
  phase_0:
    name: "Foundation"
    status: frozen
    frozen_date: "2026-08-03"
    issues: ["#55", "#56", "#57", "#58"]
    description: >
      Shared modules created, duplicates consolidated, runtime integration
      verified. 59 tests validate the foundation.

    frozen_files:
      - path: "extension/shared/option-match.js"
        reason: "Canonical option matching — 5 callers depend on this API"
      - path: "extension/shared/dom-utils.js"
        reason: "Canonical label resolution + isVisible — 6 callers"
      - path: "extension/shared/network-idle.js"
        reason: "Canonical network idle — 2 callers"
      - path: "extension/shared/select-apply.js"
        reason: "Canonical select event dispatch — 1 caller + executor variant"
      - path: "extension/shared/label-utils.js"
        reason: "Canonical semantic keys + confidence — background.js mirrors this"

    allowed_changes:
      - "Bug fixes with test coverage"
      - "Adding new exports (non-breaking)"
      - "Performance improvements that don't change behavior"

    forbidden_changes:
      - "Changing function signatures"
      - "Removing exports"
      - "Changing matching algorithm behavior without updating all callers"
      - "Adding external dependencies"

  phase_0_4:
    name: "Slim Extension Architecture"
    status: frozen
    frozen_date: "2026-08-03"
    issues: ["#59"]
    description: >
      Architecture audit documents the two-layer split.
      Extension = perception/execution/observation.
      Service = planning/knowledge/memory/judgment/AI.

    frozen_files:
      - path: "extension-dev/docs/ARCHITECTURE_AUDIT.md"
        reason: "Architecture contract — changes require architectural review"

    allowed_changes:
      - "Updating metrics/status as phases complete"
      - "Adding new sections"
      - "Correcting factual errors"

    forbidden_changes:
      - "Changing the runtime boundary definition"
      - "Moving responsibilities between runtimes without new issue"
      - "Removing the migration plan"

  phase_0_5:
    name: "Architecture Governance"
    status: active
    issues: ["#60"]
    description: "This governance framework itself."

    frozen_files: []
    note: "Will freeze once deployed to GitHub and CI is green"

# ── Completed phases ─────────────────────────────────────────────────

  phase_1:
    name: "Execution Engine"
    status: complete_with_exceptions
    frozen_date: "2026-08-04"
    issues: ["#61", "#62", "#63", "#64", "#79", "#80", "#81", "#82", "#84"]
    description: >
      All 15 browser capabilities built and tested. Runner, resolver,
      capability registry, IR models implemented. Executor remains primary
      engine (runner is observer-only). 384→537 tests.
    exceptions:
      - "Runner is not primary execution engine (executor remains primary)"
      - "ActionPlan schema defined by code, not formal spec document"
      - "No true unpacked-extension E2E test"

# ── Frozen phases ────────────────────────────────────────────────────

  phase_2:
    name: "Knowledge Model"
    status: frozen
    frozen_date: "2026-08-05"
    issues: ["#85", "#86", "#87", "#88", "#89", "#90", "#91", "#92"]
    description: >
      Server-side knowledge model: universal schema, knowledge store,
      scope resolution engine, validation engine, hardcoded knowledge
      migration, versioning/migration safety, sync protocol, and
      extension sync client.
    sub_phases:
      - "2.1: Universal Knowledge Schema (#85) ✓"
      - "2.2: Knowledge Store (#86) ✓"
      - "2.3: Scope Resolution Engine (#87) ✓"
      - "2.4: Validation Engine (#88) ✓"
      - "2.5: Audit and Migrate Hardcoded Knowledge (#89) ✓"
      - "2.6: Versioning and Migration Safety (#90) ✓"
      - "2.7: Sync Protocol (#91) ✓"
      - "2.8: Extension Sync Client and Final Migration (#92) ✓"

    frozen_files:
      - path: "architecture/knowledge-schema.yml"
        reason: "Universal knowledge schema — all service modules depend on this contract"
      - path: "architecture/knowledge-schema.json"
        reason: "JSON Schema validation — used by validation engine"
      - path: "architecture/sync-protocol.yml"
        reason: "Sync protocol contract — extension and service both implement this"
      - path: "extension-service/knowledge-store.js"
        reason: "Knowledge store core — routes, validation, and versioning depend on its API"
      - path: "extension-service/validation-engine.js"
        reason: "Validation rules — knowledge-store.js integrates this on create"
      - path: "extension-service/scope-resolver.js"
        reason: "Scope resolution algorithm — sync and resolution routes depend on this"
      - path: "extension/knowledge-sync.js"
        reason: "Extension sync client — mapper.js and derive.js consume its cache"

    allowed_changes:
      - "Bug fixes with test coverage"
      - "Performance improvements that don't change behavior"
      - "Adding new knowledge kinds to the schema (non-breaking)"
      - "Adding new sync artifacts"

    forbidden_changes:
      - "Changing the scope resolution algorithm"
      - "Changing the knowledge record envelope structure"
      - "Removing sync endpoints"
      - "Changing the cache key structure"
      - "Breaking the validation engine's export API"

    temporary_exceptions:
      - id: EXC-002
        description: "Strategic mapping still in extension (mapper.js, rule-engine.js)"
        removal_condition: "Phase 4 Planner provides field→value mapping in fill plan"
      - id: EXC-005
        description: "Derived values still computed in extension (derive.js)"
        removal_condition: "Service computes derived values and includes them in profile"

# ── Future phases ───────────────────────────────────────────────────

  phase_3:
    name: "Browser Perception"
    status: planned
    description: "Page understanding beyond DOM extraction. Component detection, cascade graph."
    prerequisites:
      - "Phase 2 knowledge model available"

  phase_4:
    name: "Planner"
    status: planned
    description: "Service generates ordered, dependency-aware fill plans."

  phase_5:
    name: "Learning Engine"
    status: planned
    description: "Corrections → improved mappings. Cross-user generalization."

  phase_6:
    name: "AI Reasoning"
    status: planned
    description: "LLM-powered field mapping, document understanding, judgment."

  phase_7:
    name: "Autonomous CyberCafe Agent"
    status: planned
    description: "End-to-end autonomous form filling with minimal operator input."
