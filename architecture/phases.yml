# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CyberControl Phase Freeze Rules
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Frozen phases have stabilized code that must not be casually modified.
# Changes to frozen files require explicit justification in the PR.
#
# This is NOT a hard block — it's a review gate.
# CI will WARN (not fail) when frozen files are touched.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

version: "1.0"

phases:
  phase_0:
    name: "Foundation"
    status: frozen
    frozen_date: "2026-08-03"
    issues: ["#55", "#56", "#57", "#58"]
    description: >
      Shared modules created, duplicates consolidated, runtime integration
      verified. 59 tests validate the foundation.

    frozen_files:
      - path: "extension/shared/option-match.js"
        reason: "Canonical option matching — 5 callers depend on this API"
      - path: "extension/shared/dom-utils.js"
        reason: "Canonical label resolution + isVisible — 6 callers"
      - path: "extension/shared/network-idle.js"
        reason: "Canonical network idle — 2 callers"
      - path: "extension/shared/select-apply.js"
        reason: "Canonical select event dispatch — 1 caller + executor variant"
      - path: "extension/shared/label-utils.js"
        reason: "Canonical semantic keys + confidence — background.js mirrors this"

    allowed_changes:
      - "Bug fixes with test coverage"
      - "Adding new exports (non-breaking)"
      - "Performance improvements that don't change behavior"

    forbidden_changes:
      - "Changing function signatures"
      - "Removing exports"
      - "Changing matching algorithm behavior without updating all callers"
      - "Adding external dependencies"

  phase_0_4:
    name: "Slim Extension Architecture"
    status: frozen
    frozen_date: "2026-08-03"
    issues: ["#59"]
    description: >
      Architecture audit documents the two-layer split.
      Extension = perception/execution/observation.
      Service = planning/knowledge/memory/judgment/AI.

    frozen_files:
      - path: "extension-dev/docs/ARCHITECTURE_AUDIT.md"
        reason: "Architecture contract — changes require architectural review"

    allowed_changes:
      - "Updating metrics/status as phases complete"
      - "Adding new sections"
      - "Correcting factual errors"

    forbidden_changes:
      - "Changing the runtime boundary definition"
      - "Moving responsibilities between runtimes without new issue"
      - "Removing the migration plan"

  phase_0_5:
    name: "Architecture Governance"
    status: frozen
    frozen_date: "2026-08-05"
    issues: ["#60"]
    description: "This governance framework itself."

    frozen_files:
      - path: "architecture/verification.yml"
        reason: "CI check registry — must match the executed workflow steps"
      - path: "architecture/boundaries.yml"
        reason: "Dependency and forbidden-pattern definitions used by CI"
      - path: "architecture/ownership.yml"
        reason: "Subsystem ownership map used by review"
      - path: ".github/workflows/architecture.yml"
        reason: "Executed governance workflow"
    note: >
      Frozen now that the governance workflow is deployed and CI is green. A
      later phase (e.g. Phase 3.0) may not claim its governance is frozen while
      this framework is unfrozen, so this phase is frozen together with the
      contracts that depend on it.

    allowed_changes:
      - "Aligning check IDs/labels with the executed workflow"
      - "Adding new checks or forbidden patterns"
      - "Correcting factual drift between registry and workflow"

    forbidden_changes:
      - "Silently diverging verification IDs from workflow steps"
      - "Removing a check without recording it in removed_checks"

# ── Completed phases ─────────────────────────────────────────────────

  phase_1:
    name: "Execution Engine"
    status: complete_with_exceptions
    frozen_date: "2026-08-04"
    issues: ["#61", "#62", "#63", "#64", "#79", "#80", "#81", "#82", "#84"]
    description: >
      All 15 browser capabilities built and tested. Runner, resolver,
      capability registry, IR models implemented. Executor remains primary
      engine (runner is observer-only). 384→537 tests.
    exceptions:
      - "Runner is not primary execution engine (executor remains primary)"
      - "ActionPlan schema defined by code, not formal spec document"
      - "No true unpacked-extension E2E test"

# ── Frozen phases ────────────────────────────────────────────────────

  phase_2:
    name: "Knowledge Model"
    status: frozen
    frozen_date: "2026-08-05"
    issues: ["#85", "#86", "#87", "#88", "#89", "#90", "#91", "#92"]
    description: >
      Server-side knowledge model: universal schema, knowledge store,
      scope resolution engine, validation engine, hardcoded knowledge
      migration, versioning/migration safety, sync protocol, and
      extension sync client.
    sub_phases:
      - "2.1: Universal Knowledge Schema (#85) ✓"
      - "2.2: Knowledge Store (#86) ✓"
      - "2.3: Scope Resolution Engine (#87) ✓"
      - "2.4: Validation Engine (#88) ✓"
      - "2.5: Audit and Migrate Hardcoded Knowledge (#89) ✓"
      - "2.6: Versioning and Migration Safety (#90) ✓"
      - "2.7: Sync Protocol (#91) ✓"
      - "2.8: Extension Sync Client and Final Migration (#92) ✓"

    frozen_files:
      - path: "architecture/knowledge-schema.yml"
        reason: "Universal knowledge schema — all service modules depend on this contract"
      - path: "architecture/knowledge-schema.json"
        reason: "JSON Schema validation — used by validation engine"
      - path: "architecture/sync-protocol.yml"
        reason: "Sync protocol contract — extension and service both implement this"
      - path: "extension-service/knowledge-store.js"
        reason: "Knowledge store core — routes, validation, and versioning depend on its API"
      - path: "extension-service/validation-engine.js"
        reason: "Validation rules — knowledge-store.js integrates this on create"
      - path: "extension-service/scope-resolver.js"
        reason: "Scope resolution algorithm — sync and resolution routes depend on this"
      - path: "extension/knowledge-sync.js"
        reason: "Extension sync client — mapper.js and derive.js consume its cache"

    allowed_changes:
      - "Bug fixes with test coverage"
      - "Performance improvements that don't change behavior"
      - "Adding new knowledge kinds to the schema (non-breaking)"
      - "Adding new sync artifacts"

    forbidden_changes:
      - "Changing the scope resolution algorithm"
      - "Changing the knowledge record envelope structure"
      - "Removing sync endpoints"
      - "Changing the cache key structure"
      - "Breaking the validation engine's export API"

    temporary_exceptions:
      - id: EXC-002
        description: "Strategic mapping still in extension (mapper.js, rule-engine.js)"
        removal_condition: "Phase 4 Planner provides field→value mapping in fill plan"
      - id: EXC-005
        description: "Derived values still computed in extension (derive.js)"
        removal_condition: "Service computes derived values and includes them in profile"

# ── Phase 3 architecture gate ───────────────────────────────────────

  phase_3_0:
    name: "Browser Perception Architecture & Governance"
    status: frozen
    frozen_date: "2026-08-05"
    issues: ["#96"]
    remediation:
      issue: "#97"
      tracker: "CYB-68"
      title: "Phase 3.0.1 — Fix Browser Perception Contract Blockers Before Freeze"
      status: in_progress
      note: >
        The Phase 3.0 freeze was rejected by principal architecture review. The
        frozen contracts below have been amended by Phase 3.0.1 to resolve P0
        blockers (typed deltas, document/context identity, exact stale-target
        semantics, ActionPlan v3 and ExecutionObservation schemas, in-schema
        privacy, canonicalization standard, gateway threat model, bridge/token
        hardening, governance reconciliation, and the selector-adapter conflict).
        Ratification of the freeze remains pending a follow-up adversarial review;
        issue #97 stays OPEN until that review passes.
    description: >
      Architecture-only gate defining Page IR v2, public/private binding
      separation, DOM gateway boundaries, snapshot lifecycle, privacy,
      confidence, widget taxonomy, performance, and migration. No perception
      runtime behavior is implemented by this phase.
    frozen_files:
      - path: "architecture/perception-contract.yml"
        reason: "Normative eyes/hands versus brain contract"
      - path: "architecture/page-ir.yml"
        reason: "Human-readable public Page IR v2 contract"
      - path: "architecture/page-ir.schema.json"
        reason: "Canonical language-independent PageSnapshot/PageDelta schema"
      - path: "architecture/action-plan.schema.json"
        reason: "Canonical ActionPlan v3 service→extension contract (Phase 3.0.1)"
      - path: "architecture/execution-observation.schema.json"
        reason: "Canonical ExecutionObservation v3 extension→service contract (Phase 3.0.1)"
      - path: "architecture/dom-access-policy.yml"
        reason: "Observation and interaction gateway boundary"
      - path: "architecture/gateway-security.yml"
        reason: "DOM gateway threat model and bridge/token hardening (Phase 3.0.1)"
      - path: "architecture/widget-taxonomy.yml"
        reason: "Behavior-based widget classification contract"
      - path: "architecture/perception-lifecycle.yml"
        reason: "Document, snapshot, revision, delta, and stale-target lifecycle"
      - path: "architecture/perception-privacy.yml"
        reason: "Data minimization, redaction, and screenshot policy"
      - path: "architecture/perception-confidence.yml"
        reason: "Evidence and technical confidence model"
      - path: "architecture/perception-performance.yml"
        reason: "Perception payload and latency budgets"
      - path: "architecture/ir-migrations/README.md"
        reason: "IR v1 to v2 compatibility and rollout policy"
      - path: "architecture/adrs/0001-public-ir-private-bindings.md"
        reason: "Accepted public/private binding decision"
      - path: "architecture/adrs/0002-snapshot-revision-lifecycle.md"
        reason: "Accepted immutable snapshot decision"
      - path: "architecture/adrs/0003-dom-gateway-boundaries.md"
        reason: "Accepted DOM gateway decision"
      - path: "architecture/adrs/0004-perception-identity.md"
        reason: "Accepted document-scoped identity decision"
      - path: "architecture/adrs/0005-cross-origin-contexts.md"
        reason: "Accepted inaccessible-context decision"
      - path: "architecture/adrs/0006-screenshot-privacy.md"
        reason: "Accepted screenshot privacy decision"
      - path: "architecture/adrs/0007-service-adapter-no-selector.md"
        reason: "Accepted selector-adapter reconciliation decision (Phase 3.0.1)"
    allowed_changes:
      - "Clarifications that do not weaken a MUST or MUST NOT rule"
      - "Additive optional IR fields with schema and migration tests"
      - "Measured budget tightening with benchmark evidence"
      - "Privacy restrictions that reduce collected data"
    forbidden_changes:
      - "Adding selectors, XPath, DOM handles, HTML, or private bindings to public IR"
      - "Allowing service-side DOM access or browser-specific planning"
      - "Allowing execution to perform semantic discovery"
      - "Weakening secret, screenshot, or cross-origin protections without a new ADR"
      - "Changing IR major-version semantics without a migration plan"

