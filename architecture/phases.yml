# ── Phase 3 numbering policy (authoritative; #142 audit / #144 hygiene) ──
#
# POLICY A — Repository numbering wins.
#   - architecture/phases.yml phase_3_* keys are the sole authoritative
#     Phase 3 milestone identifiers for freezes, CI, and "what is next."
#   - Issue titles, Notion/conceptual lists, and program maps must not
#     override these keys.
#   - Existing keys MUST NOT be renamed to resemble the conceptual
#     3.0–3.10 perception taxonomy (that taxonomy is a separate axis).
#
# Conceptual perception taxonomy (planning language only; NOT registry keys):
#   3.0 Architecture → phase_3_0
#   3.1 IR (contracts) → contracts under phase_3_0; earlier FormModel IR = Phase 1.1
#   3.2 DOM Gateway & context → implemented under phase_3_1 (gateway + contexts)
#   3.3 Structural perception → phase_3_1 (snapshot/nodes) + completion in phase_3_3
#   3.4 Widget classification → phase_3_2  (NOT phase_3_4)
#   3.5 Relationship detection → phase_3_3
#   3.6 Runtime state & deltas → phase_3_3 (folded)
#   3.7 Navigation understanding → phase_3_5 (frozen #156)
#   3.8 Visual context → phase_3_6 (frozen #163)
#   3.9 Hardening & validation → phase_3_7 (architecture_draft #164; not frozen)
#   3.10 Public API & migration → ir-migrations under 3.0; not a separate freeze key
#   (no conceptual slot) WSS → phase_3_4
#
# Program map axis (GitHub #118 integer Phases 0–10) is product delivery
# sequencing and is independent of phase_3_* keys (e.g. program Phase 7 = WSS
# while repository WSS = phase_3_4).
#
# ActionPlanExecutor v3 (#138–#141) is supporting implementation of frozen
# ActionPlan/EO contracts from phase_3_0.1 — NOT a phase_3_* milestone.
#
# phase_4_* / phase_5_* / phase_7_* entries below that still say status:complete
# are historical registry text; they MUST NOT be treated as independently
# ratified product freezes while constitution temporary_exceptions EXC-001..005
# remain. Separate evidence is required before claiming those complete.
#
# phase_3_5 Navigation Understanding: frozen via independent ratification #156
# (architecture #145–#148; runtime #150–#153; residual P2 rem #153→f023d0b).
#
# phase_3_6 Visual Context (conceptual 3.8): frozen via independent ratification #163
# (architecture #158–#159; runtime #160; impl reviews #161–#162; tip b9e9427).
#
# phase_3_7 Hardening / Validation / Repository Architecture (conceptual 3.9):
