# These violations are acknowledged and will be removed when the
# extension-service provides the corresponding capability.
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

temporary_exceptions:
  - id: EXC-001
    description: "AI/LLM calls in page context"
    files:
      - "extension/autofill/mapper.js"
      - "extension/autofill/ai-resolve.js"
      - "extension/autofill/executor.js"
    removal_condition: "Service provides POST /fill-plan with AI-resolved values"

  - id: EXC-002
    description: "Strategic mapping in extension"
    files:
      - "extension/autofill/mapper.js"
      - "extension/autofill/rule-engine.js"
      - "extension/shared/label-utils.js"
    removal_condition: "Service provides field→value mapping in fill plan response"

  - id: EXC-003
    description: "Fill planning in popup.js"
    files:
      - "extension/popup.js"
    removal_condition: "Service returns ordered, dependency-aware fill plans"

  - id: EXC-004
    description: "Teach/auto-teach in background.js"
    files:
      - "extension/background.js"
    removal_condition: "Service owns teach sessions via API"

  - id: EXC-005
    description: "Derived values in extension"
    files:
      - "extension/autofill/derive.js"
    removal_condition: "Service computes derived values and includes them in profile response"
