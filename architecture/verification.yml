# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# CyberControl Architecture Verification Checks
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Defines the checks that CI runs on every push/PR.
# Each check produces a PASS/WARN/FAIL result.
#
# FAIL = PR cannot merge
# WARN = PR can merge but reviewer should inspect
# PASS = no issue
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

version: "1.0"

checks:
  # ── HARD FAILURES ──────────────────────────────────────────────────

  - id: CHECK-001
    name: "Forbidden patterns"
    severity: fail
    description: >
      Rejects new code that reintroduces consolidated logic, inline LLM
      calls, framework-specific knowledge, extension-side planning, or
      single-percentage promotion thresholds. Enforces FB-001 through FB-004
      and FB-010 through FB-013 on added lines. FB-005 through FB-007 are
      declared in boundaries.yml but not yet grep-enforced; FB-008
      (public-IR locators) is enforced by CHECK-008, and FB-009 (DOM access)
      is enforced by CHECK-009.
    method: "grep_diff"
    scope: "added_lines_only"
    enforced_forbidden_patterns: ["FB-001", "FB-002", "FB-003", "FB-004", "FB-010", "FB-011", "FB-012", "FB-013"]
    declared_not_grep_enforced: ["FB-005", "FB-006", "FB-007"]
    note: "Only checks NEW code in the diff, not existing violations"

  - id: CHECK-003
    name: "Dependency direction"
    severity: fail
    description: >
      Rejects shared/ modules that import from autofill/, drivers/, or popup,
      and drivers/ that import from autofill/ or popup. Uses
      allowed_dependencies from boundaries.yml.
    method: "grep_imports"
    scope: "full_file"

  - id: CHECK-005
    name: "Tests pass"
    severity: fail
    description: >
      All unit, integration, model, capability, runner, knowledge, governance,
      and browser suites pass. Runs in the unit-and-knowledge and browser CI
      jobs plus the Phase 3 governance test.
    method: "run_tests"
    commands:
      - "node extension-dev/tests/ci-unit.mjs"
      - "node extension-dev/tests/ci-browser.mjs"
      - "node extension-dev/tests/test-phase3-governance.mjs"

  - id: CHECK-008
    name: "Phase 3 architecture contracts"
    severity: fail
    description: >
      Verifies every frozen Phase 3.0/3.0.1 contract and ADR exists, the
      canonical Page IR, ActionPlan, and ExecutionObservation schemas parse,
      public schema fields contain no browser-private locator/binding keys,
      Phase 2 remains frozen, Phase 3.0 is frozen, and (since #144) the
      repository Phase 3 registry reports phase_3_1..phase_3_4 with the
      authoritative numbering policy (repo keys win; no conceptual renumber).
    method: "run_governance_test"
    command: "node extension-dev/tests/test-phase3-governance.mjs"

  - id: CHECK-009
    name: "No new DOM access outside gateway"
    severity: fail
    description: >
      Rejects structural DOM APIs added outside extension/runtime/dom-gateway.js
      and extension/perception/. Existing DOM access is grandfathered for
      migration but may not expand. Enforces FB-009.
    method: "grep_diff"
    scope: "added_lines_only"
    source: "architecture/dom-access-policy.yml"

  - id: CHECK-010
    name: "Adversarial schema conformance"
    severity: fail
    description: >
      Validates positive and malicious fixtures against the canonical Page IR,
      ActionPlan v3, and ExecutionObservation v3 schemas using a real Draft
      2020-12 validator (AJV). Positive fixtures MUST validate; malicious
      fixtures (selector smuggling, untyped deltas, secret-without-redaction,
      fuzzy/selector plan targets, raw value leaks) MUST be rejected. This is
      the enforceability proof required to ratify the Phase 3.0 freeze.
    method: "run_conformance"
    command: "node extension-dev/tests/ratification/run-conformance.mjs"

  - id: CHECK-011
    name: "Extension and browser boundary security"
    severity: fail
    description: >
      Permanently preserves SEC-001 through SEC-004 and the browser-private
      boundary. Executes hostile postMessage and real background CONNECT
      overwrite attempts; rejects token/DOM-attribute exfiltration channels and
      broad host permissions; and prevents selectors, DOM handles, or private
      bindings from entering public Page IR, ActionPlan, or ExecutionObservation
      schemas. Every future extension/browser security fix adds exploit-shaped
      regression coverage here before its issue is closed.
    method: "run_security_regressions"
    command: "node extension-dev/tests/security/run.mjs"
    ci_job: "extension-security"
    scope: "full_tree"

  - id: CHECK-012
    name: "Discussion 11 architecture invariants"
    severity: fail
    description: >
      Enforces the finalized Discussion 11 fill architecture invariants:
      (1) No framework names in knowledge-store records or perception output,
      (2) AI/LLM credential references only in extension-service/ code,
      (3) Extension runtime code must not contain planning/strategy functions,
      (4) Server planner code must not reference browser-private bindings,
      (5) Knowledge promotion code must use multi-dimensional criteria.
      Implemented as a governance test suite.
    method: "run_governance_test"

  - id: CHECK-013
    name: "Phase 3.5 Navigation Understanding architecture contract"
    severity: fail
    description: >
      Verifies phase_3_5 architecture_draft artifacts exist (navigation
      contract, ADRs 0008–0009, draft additives, fixtures), ownership and
      registry alignment, forbidden public keys on positive fixtures, and that
      phase_3_5 is not frozen and does not rename prior phase_3_* keys.
      Architecture-only; does not require runtime navigation implementation.
    method: "run_governance_test"
    command: "node extension-dev/tests/test-phase35-navigation-governance.mjs"
    issue: "#145"
    command: "node extension-dev/tests/test-d11-invariants.mjs"
    ci_job: "architecture"
    scope: "full_tree"

  # ── WARNINGS ───────────────────────────────────────────────────────

  - id: CHECK-002
    name: "Frozen file modification"
    severity: warn
    description: >
      Files listed in phases.yml as frozen are being modified.
      Reviewer should verify the change is a permitted type
      (bug fix, non-breaking addition, performance improvement).
    method: "check_frozen_files"
    source: "architecture/phases.yml"

  # ── INFO (always passes, generates report) ─────────────────────────

  - id: CHECK-004
    name: "Architecture health report"
    severity: info
    description: "Generates a summary of current architecture state and phase status"
    method: "generate_report"
    outputs:
      - "Total temporary exceptions remaining"
      - "Frozen file count"
      - "Test file count"
      - "Phase status table"

removed_checks:
  note: >
    Earlier drafts declared a service-owned-code ownership check and a separate
    dependency-direction warning that the workflow never implemented. They are
    removed to keep this registry aligned with the executed CI steps. Ownership
    drift is tracked in ownership.yml and reviewed manually.

# ── Report format ────────────────────────────────────────────────────

report:
  format: "markdown"
  output: "architecture-report.md"
  sections:
    - title: "Verification Results"
      content: "Table of CHECK-001..011 with PASS/WARN/FAIL"
    - title: "Temporary Exceptions"
      content: "List from constitution.yml with file count"
    - title: "Phase Status"
      content: "Table from phases.yml"
    - title: "Subsystem Changes"
      content: "Which subsystems were touched in this PR"
