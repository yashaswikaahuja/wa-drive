upstream hub {
    server backend:3000;
}
upstream ext_svc {
    server extension-service:3300;
}
upstream fe {
    server frontend:80;
}

server {
    listen 80;
    server_name api.cybercontrol.fun;
    client_max_body_size 50M;

    # extension-service routes
    location /api/profiles  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/mappings  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/adapters  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/sessions  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/corrections { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/training  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/agent     { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; proxy_read_timeout 60s; }
    location /api/fill-plan { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/fill-observation { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }

    # Socket.IO
    location /socket.io/ {
        proxy_pass http://hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # Everything else → hub
    location / {
        proxy_pass http://hub;
        include /etc/nginx/proxy_params;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

server {
    listen 80 default_server;
    server_name app.cybercontrol.fun localhost _;

    # API and Socket.IO → backend services
    location /api/profiles  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/mappings  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/adapters  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/sessions  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/corrections { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/training  { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/agent     { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; proxy_read_timeout 60s; }
    location /api/fill-plan { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }
    location /api/fill-observation { proxy_pass http://ext_svc; include /etc/nginx/proxy_params; }

    location /api/ {
        proxy_pass http://hub;
        include /etc/nginx/proxy_params;
    }

    location /socket.io/ {
        proxy_pass http://hub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://fe;
        include /etc/nginx/proxy_params;
    }
}
