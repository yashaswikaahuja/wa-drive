server {
    server_name api.cybercontrol.fun cybercontrol.fun;

    client_max_body_size 50M;

    # Dedicated socket.io block for WebSocket — keep open + buffer-free
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long timeouts so websocket idle doesn't drop
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Disable buffering — push messages immediately
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;

        # Add CORS on error responses (when backend is down)
        error_page 502 503 504 = @cors_error;
    }

    location @cors_error {
        add_header Access-Control-Allow-Origin * always;
        add_header Content-Type application/json;
        return 503 '{"error":"Service temporarily unavailable"}';
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.cybercontrol.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cybercontrol.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    server_name api.cybercontrol.fun cybercontrol.fun;
    return 301 https://$host$request_uri;
}
